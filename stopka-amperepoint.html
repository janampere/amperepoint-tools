<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Stopka – Ampere Point</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fff8f3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 36px 40px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    max-width: 660px;
    width: 100%;
    text-align: center;
  }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #aaa;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .fields {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .field {
    flex: 1;
    text-align: left;
  }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    color: #0f172a;
    font-family: inherit;
    transition: border-color 0.15s;
    outline: none;
  }
  .field input:focus { border-color: #FF6B00; }
  .preview-wrap {
    background: #fafafa;
    border: 1px solid #efefef;
    border-radius: 10px;
    padding: 28px 24px;
    margin-bottom: 20px;
    text-align: left;
    display: inline-block;
    width: 100%;
  }
  .buttons { display: flex; gap: 10px; margin-bottom: 6px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-gmail { background: #FF6B00; color: white; }
  .btn-gmail:hover { background: #e05a00; box-shadow: 0 6px 18px rgba(255,107,0,0.3); }
  .btn-pipe { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
  .btn-pipe:hover { background: #e8edf3; }
  .copied {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    min-height: 20px;
    opacity: 0;
    transition: opacity 0.2s;
    color: #FF6B00;
  }
  .copied.show { opacity: 1; }
  .reroll {
    background: none;
    border: 1px solid #ffe0cc;
    color: #FF6B00;
    border-radius: 8px;
    padding: 7px 18px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 14px;
    transition: background 0.15s;
  }
  .reroll:hover { background: #fff0e6; }
  .variant-row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .variant-row .reroll { margin-top: 0; }
  .reroll.knm { border-color: #dbe0ea; color: #334155; }
  .reroll.knm:hover { background: #f1f5f9; }
  .reroll.knm.active {
    background: linear-gradient(90deg, #e2001a 0%, #1a3fd4 100%);
    border-color: transparent;
    color: #fff;
  }
  .reroll.knm.active:hover { background: linear-gradient(90deg, #f50020 0%, #2249ea 100%); }
  .variant-note { margin-top: 9px; font-size: 11px; color: #94a3b8; line-height: 1.6; min-height: 17px; }
  .hint {
    margin-top: 20px;
    background: #fff8f3;
    border: 1px solid #ffe0cc;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
  }
  .hint .step { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .hint .step:last-child { margin-bottom: 0; }
  .hint p { font-size: 12px; color: #555; line-height: 1.8; }
  .hint p b { color: #FF6B00; }
  .tag {
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    background: #FF6B00; color: white; border-radius: 4px;
    padding: 2px 6px; white-space: nowrap; flex-shrink: 0;
  }
  .tag.pipe { background: #1a6fe8; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Stopka email · Ampere Point</div>

  <div class="fields">
    <div class="field">
      <label>Imię i nazwisko</label>
      <input type="text" id="fname" value="Jan Prószyński" oninput="render()" />
    </div>
    <div class="field">
      <label>Telefon</label>
      <input type="text" id="fphone" value="+48 694 985 723" oninput="render()" />
    </div>
  </div>

  <div class="preview-wrap">
    <div id="preview"></div>
  </div>

  <div class="buttons">
    <button class="btn btn-gmail" onclick="copyGmail()">📧 Kopiuj do Gmaila</button>
    <button class="btn btn-pipe" onclick="copyHTML()">{ } Kopiuj HTML (Pipedrive)</button>
  </div>
  <div class="copied" id="copied"></div>
  <div class="variant-row">
    <button class="reroll" onclick="reroll()">↻ Inny banner</button>
    <button class="reroll knm" id="knmBtn" onclick="toggleKNM()">KNM 2026</button>
  </div>
  <div class="variant-note" id="variantNote"></div>

  <div class="hint">
    <div class="step">
      <span class="tag">Gmail</span>
      <p>Kliknij <b>„Kopiuj do Gmaila"</b> → Ustawienia → Podpis → Utwórz nowy → wklej (Ctrl+V) w polu tekstowym</p>
    </div>
    <div class="step">
      <span class="tag pipe">Pipedrive</span>
      <p>Kliknij <b>„Kopiuj HTML"</b> → Ustawienia → Poczta → Podpis → tryb HTML → wklej</p>
    </div>
  </div>
</div>

<script>
const banners = [
  "https://cdn.shopify.com/s/files/1/0780/2218/1190/files/Eco_warrior.svg?v=1774857846",
  "https://cdn.shopify.com/s/files/1/0780/2218/1190/files/NoGas.svg?v=1774857846",
  "https://cdn.shopify.com/s/files/1/0780/2218/1190/files/ECO_beast.svg?v=1774857986",
  "https://cdn.shopify.com/s/files/1/0780/2218/1190/files/Coffee.svg?v=1774857986",
  "https://cdn.shopify.com/s/files/1/0780/2218/1190/files/Current_King.svg?v=1774857986"
];

// Wariant specjalny - banner wydarzenia. Imienny, wiec poza losowa pula.
const KNM = {
  url: "https://amperepoint-tools.vercel.app/knm2026-jan-proszynski.jpg",
  size: 150,
  href: "https://www.newmobilitycongress.com/",
  alt: "New Mobility Congress 2026, 23-25.09, MCK Katowice - Jan Prószyński, Ampere Point",
  note: "Banner imienny (Jan Prószyński) - ważny do 25.09.2026."
};

let current = Math.floor(Math.random() * banners.length);
let mode = "random"; // "random" | "knm"

function getBanner() {
  if (mode === "knm") return KNM;
  return { url: banners[current], size: 130, href: null, alt: "Ampere Point" };
}

function bannerImg(b) {
  const img = '<img src="' + b.url + '" alt="' + b.alt + '" width="' + b.size + '" height="' + b.size + '" style="display:block;width:' + b.size + 'px;height:' + b.size + 'px;object-fit:contain;border:0;" />';
  return b.href ? '<a href="' + b.href + '" target="_blank" style="text-decoration:none;border:0;">' + img + '</a>' : img;
}

function sigHTML(b, name, phone) {
  return '<table cellpadding="0" cellspacing="0" border="0" style="font-family:Helvetica Neue,Helvetica,Arial,sans-serif;color:#1a1a1a;border-collapse:collapse;"><tr><td style="vertical-align:middle;padding:12px 24px 12px 12px;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="padding-bottom:3px;"><span style="font-size:17px;font-weight:700;color:#0f172a;letter-spacing:-0.3px;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;">' + name + '</span></td></tr><tr><td style="padding-bottom:14px;"><span style="font-size:12px;font-weight:700;color:#FF6B00;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;">Ampere Point</span></td></tr><tr><td style="padding-bottom:5px;"><a href="tel:' + phone.replace(/\s/g,'') + '" style="font-size:12px;color:#555555;text-decoration:none;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;">' + phone + '</a></td></tr><tr><td style="padding-bottom:14px;"><a href="https://www.amperepoint.com" style="font-size:12px;color:#FF6B00;text-decoration:none;font-weight:600;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;">www.amperepoint.com</a></td></tr><tr><td><a href="https://www.linkedin.com/company/amperepoint/" style="font-size:11px;color:#0077b5;text-decoration:none;font-weight:700;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;margin-right:10px;">LinkedIn</a><a href="https://www.facebook.com/p/AmperePoint-61579079154085/" style="font-size:11px;color:#1877f2;text-decoration:none;font-weight:700;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;margin-right:10px;">Facebook</a><a href="https://www.instagram.com/ampere.point/" style="font-size:11px;color:#e1306c;text-decoration:none;font-weight:700;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;margin-right:10px;">Instagram</a><a href="https://www.youtube.com/@AmperePoint" style="font-size:11px;color:#ff0000;text-decoration:none;font-weight:700;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;">YouTube</a></td></tr></table></td><td style="vertical-align:middle;padding:12px 12px 12px 24px;">' + bannerImg(b) + '</td></tr></table>';
}

function getVals() {
  return {
    name: document.getElementById('fname').value || 'Imię Nazwisko',
    phone: document.getElementById('fphone').value || '+48 000 000 000'
  };
}

function render() {
  const v = getVals();
  document.getElementById('preview').innerHTML = sigHTML(getBanner(), v.name, v.phone);
  document.getElementById('knmBtn').classList.toggle('active', mode === 'knm');
  document.getElementById('variantNote').textContent = mode === 'knm' ? KNM.note : '';
}

function reroll() {
  if (mode === 'knm') { mode = 'random'; render(); return; }
  let next;
  do { next = Math.floor(Math.random() * banners.length); } while (next === current);
  current = next;
  render();
}

function toggleKNM() {
  mode = mode === 'knm' ? 'random' : 'knm';
  render();
}

function toast(msg) {
  const el = document.getElementById('copied');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

async function copyGmail() {
  const v = getVals();
  const h = sigHTML(getBanner(), v.name, v.phone);
  try {
    const blob = new Blob([h], { type: 'text/html' });
    await navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]);
    toast('✓ Skopiowano! Wklej w edytorze podpisu Gmaila.');
  } catch(e) {
    const el = document.getElementById('preview');
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    toast('✓ Skopiowano! Wklej w edytorze podpisu Gmaila.');
  }
}

async function copyHTML() {
  const v = getVals();
  await navigator.clipboard.writeText(sigHTML(getBanner(), v.name, v.phone));
  toast('✓ Skopiowano HTML! Wklej w trybie HTML Pipedrive.');
}

render();
</script>
</body>
</html>
