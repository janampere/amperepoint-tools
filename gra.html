<script>
"use strict";
/* ============================================================================
   AMPERE RUSH — arcade racer, Ampere Point
   Sterowanie: pad (Gamepad API) + klawiatura jako backup.
   Jeden plik, zero zaleznosci, dziala offline na stoisku targowym.
   ========================================================================= */

// ---------------------------------------------------------------- narzedzia
const PI = Math.PI;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const rndInt = (lo, hi) => Math.floor(rnd(lo, hi + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const accelToward = (v, target, rate, dt) => v + clamp(target - v, -rate * dt, rate * dt);
const easeIn = (a, b, p) => a + (b - a) * Math.pow(p, 2);
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * PI) / 2 + 0.5);
const fogAt = (d, density) => 1 / Math.pow(Math.E, d * d * density);
const overlap = (x1, w1, x2, w2, pct) => {
  const h1 = w1 * (pct || 1) / 2, h2 = w2 * (pct || 1) / 2;
  return !((x1 + h1 < x2 - h2) || (x1 - h1 > x2 + h2));
};

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ------------------------------------------------------------------- config
// Paleta i typografia 1:1 ze storefrontu amperepoint.pl (motyw Shopify):
// Geist 400/600, kolory schematow motywu, zero zaokraglen, zero cieni.

const BLUE = '#334FB4';    // accent-2 z motywu
const INK = '#121212';     // accent-1 / kolor tekstu
const PAPER = '#FFFFFF';   // background-1

const LINE = '#D8DCE3';
const MUTED = '#6B7280';

}
const imgPrime = loadImg('https://cdn.shopify.com/s/files/1/0780/2218/1190/files/Wallbox_MAIN_23_2c3bb7e1-da33-45ed-bcdb-d729a42035f4.jpg?v=1787313349&width=320');
const imgQ11 = loadImg('https://cdn.shopify.com/s/files/1/0780/2218/1190/files/Q11_2ba5f7ed-4505-43b8-b2cc-928fbe90ddc7.png?v=1788339617&width=320');
// Zdjecie Omody leci tylko do banera nagrody - to kadr z tlem, wiec jako
// sprite na jezdni wygladalby jak latajacy prostokat.
const imgOmoda = loadImg('https://cdn.shopify.com/s/files/1/0780/2218/1190/files/omoda-9-tyl-1024x517.webp?v=1758536871&width=640');

const IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
const CFG = {
  segmentLength: 200,
  rumbleLength: 3,
  lanes: 3,
  roadWidth: 2000,
  cameraHeight: 1100,
  drawDistance: 240,
  fieldOfView: 100,
  fogDensity: 4,
  centrifugal: 0.32,
  distDivisor: 180,      // jednostki swiata -> metry (spojne z topSpeedKmh)
  topSpeedKmh: 240
};
const cameraDepth = 1 / Math.tan((CFG.fieldOfView / 2) * PI / 180);
const playerZ = CFG.cameraHeight * cameraDepth;
const maxSpeed = CFG.segmentLength / (1 / 60);
const accelRate = maxSpeed / 4.2;
const brakeRate = -maxSpeed / 1.6;
const decelRate = -maxSpeed / 6;
const offRoadDecel = -maxSpeed / 2.2;
const offRoadLimit = maxSpeed / 3.4;
// Auto gracza rysujemy w stalym rozmiarze ekranowym (~0.195 szerokosci
// kadru), co w jednostkach swiata wychodzi ~480. Ruch uliczny mial 980,
// czyli dwa razy tyle - stad wrazenie, ze inni jezdza czolgami.
const PLAYER_W = 480;
const TRAFFIC_W = 500;
const OMODA_LEVEL = 9;
const LIVES = 4;

// Kazde okrazenie to nowy poziom. Rosnie predkosc, ruch i zuzycie pradu,
// a na trasie budza sie pachołki uspione na starcie - zeby po kilku
// minutach nie dalo sie jechac z palcem w nosie.
const LEVEL = {
  speedStep: 0.07, speedMax: 1.55,
  carsStep: 3, carsMax: 30,
  drainStep: 0.12, drainMax: 1.8,
  bonus: 1000
};
function speedCap() {
  return maxSpeed * Math.min(LEVEL.speedMax, 1 + (player.level - 1) * LEVEL.speedStep);
}
function drainScale() {

}

const COLORS = {
  light:  { road: '#22252B', grass: '#EEF0F4', rumble: '#E4E7EC', lane: PAPER },
  dark:   { road: '#1C1F24', grass: '#E9ECF1', rumble: BRAND },
  start:  { road: PAPER, grass: '#EEF0F4', rumble: PAPER },
  charge: { road: '#26292F', grass: '#E9ECF1', rumble: BRAND, lane: '#FFB27A' }
};

// -------------------------------------------------------------------- audio
const Sfx = {
  ctx: null, master: null, engine: null, engGain: null, engFilter: null,
  enabled: true, started: false,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.enabled ? 0.55 : 0;
    this.master.connect(this.ctx.destination);

    this.engFilter = this.ctx.createBiquadFilter();
    this.engFilter.type = 'lowpass';
    this.engFilter.frequency.value = 900;
    this.engGain = this.ctx.createGain();
    this.engGain.gain.value = 0;
    this.engFilter.connect(this.engGain);
    this.engGain.connect(this.master);

    // Elektryk: dwa piloty zamiast warkotu spalinowego.
    this.engine = [];
    [1, 2.02].forEach((mul, i) => {
      const o = this.ctx.createOscillator();
      o.type = i ? 'sawtooth' : 'triangle';
      o.frequency.value = 120 * mul;
      const g = this.ctx.createGain();
      g.gain.value = i ? 0.25 : 0.6;
      o.connect(g); g.connect(this.engFilter);
      o.start();
      this.engine.push(o);
    });
  },
  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    this.started = true;
  },
  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.value = this.enabled ? 0.55 : 0;
  },
  engineUpdate(speedPct, offRoad) {
    if (!this.ctx || !this.engine) return;
    const t = this.ctx.currentTime;
    const base = 110 + speedPct * 520;
    this.engine[0].frequency.setTargetAtTime(base, t, 0.08);
    this.engine[1].frequency.setTargetAtTime(base * 2.02, t, 0.08);
    this.engFilter.frequency.setTargetAtTime(600 + speedPct * 2600, t, 0.1);
    this.engGain.gain.setTargetAtTime(speedPct > 0.02 ? 0.06 + speedPct * 0.13 : 0, t, 0.1);
    if (offRoad && speedPct > 0.2 && Math.random() < 0.25) this.noise(0.05, 0.05, 1800);
  },
  blip(freq, dur, type, vol) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.28, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + (dur || 0.12) + 0.02);
    return o;
  },
  noise(dur, vol, freq) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq || 800; f.Q.value = 0.8;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.2;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  pickup(streak) {
    const base = 660 * Math.pow(1.06, Math.min(streak, 12));
    const o = this.blip(base, 0.16, 'square', 0.22);
    if (o && this.ctx) o.frequency.exponentialRampToValueAtTime(base * 1.6, this.ctx.currentTime + 0.14);
  },
  crash() { this.noise(0.35, 0.4, 320); this.blip(90, 0.3, 'sawtooth', 0.25); },
  ui() { this.blip(520, 0.07, 'square', 0.18); },
  levelUp() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, 0.18, 'square', 0.26), i * 90));
  },
  start3() { this.blip(440, 0.18, 'square', 0.25); },
  start1() { this.blip(880, 0.4, 'square', 0.3); },
  gameover() {
    if (!this.ctx) return;
    [440, 330, 262, 196].forEach((f, i) => setTimeout(() => this.blip(f, 0.28, 'square', 0.22), i * 180));
  }
};

// -------------------------------------------------------------------- input
const Input = {
  steer: 0, accel: 0, brake: 0,
  pad: null, padName: '',
  keys: {}, latch: {},
  down: {}, prev: {},
  lastActivity: 0,
  touches: [], tapLatch: false, tapPoint: null, touchUsed: false,

  init() {
    this.initTouch();
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      this.keys[e.code] = true;
      this.latch[e.code] = true;   // krotkie tapniecie nie moze zginac miedzy klatkami
      this.lastActivity = performance.now();
      Sfx.resume();
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    window.addEventListener('gamepadconnected', (e) => {
      this.padName = e.gamepad.id.slice(0, 28);
      Sfx.resume();
    });
    window.addEventListener('gamepaddisconnected', () => { this.padName = ''; });
  },

  initTouch() {
    const sync = (e) => {
      this.touches = Array.from(e.touches).map((t) => ({ x: t.clientX, y: t.clientY }));
      this.lastActivity = performance.now();
    };
    const start = (e) => {
      e.preventDefault();
      sync(e);
      this.touchUsed = true;
      this.tapLatch = true;
      const t = e.changedTouches[0];
      this.pendingTap = { x: t.clientX, y: t.clientY };
      Sfx.resume();
    };
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); sync(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); sync(e); }, { passive: false });
    canvas.addEventListener('touchcancel', sync, { passive: false });
  },

  poll() {
    this.prev = Object.assign({}, this.down);
    const d = { start: false, ok: false, back: false, up: false, down: false, left: false, right: false, mute: false };
    let steer = 0, accel = 0, brake = 0, digital = true;

    // --- pad ---
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (const p of pads) if (p && p.connected) { gp = p; break; }
    this.pad = gp;
    if (gp) {
      if (!this.padName) this.padName = gp.id.slice(0, 28);
      const btn = (i) => gp.buttons[i] ? (gp.buttons[i].value > 0.2 || gp.buttons[i].pressed) : false;
      const val = (i) => gp.buttons[i] ? gp.buttons[i].value : 0;
      const ax = (i) => gp.axes.length > i ? gp.axes[i] : 0;

      let a0 = ax(0);
      if (Math.abs(a0) < 0.18) a0 = 0;
      if (a0 !== 0) { steer = a0; digital = false; }
      if (btn(14)) steer = -1;
      if (btn(15)) steer = 1;

      accel = Math.max(val(7), btn(0) ? 1 : 0);              // RT lub A/X
      brake = Math.max(val(6), btn(1) ? 1 : 0, btn(2) ? 1 : 0); // LT lub B/O

      d.start = btn(9) || btn(0);
      d.ok = btn(0) || btn(9);
      d.back = btn(1) || btn(8);
      d.up = btn(12) || ax(1) < -0.6;
      d.down = btn(13) || ax(1) > 0.6;
      d.left = btn(14) || ax(0) < -0.6;
      d.right = btn(15) || ax(0) > 0.6;
      d.mute = btn(3);

      if (Math.abs(steer) > 0.2 || accel > 0.2 || brake > 0.2 || d.start || d.back) this.lastActivity = performance.now();
    }

    // --- klawiatura (backup / testy) ---
    const k = (c) => !!(this.keys[c] || this.latch[c]);
    const left = k('ArrowLeft') || k('KeyA'), right = k('ArrowRight') || k('KeyD');
    const up = k('ArrowUp') || k('KeyW'), dn = k('ArrowDown') || k('KeyS');
    if (left) steer = -1;
    if (right) steer = 1;
    if (this.keys.ArrowUp || this.keys.KeyW) accel = 1;
    if (this.keys.ArrowDown || this.keys.KeyS) brake = 1;
    if (k('Enter') || k('Space')) { d.start = true; d.ok = true; }
    if (k('Escape')) d.back = true;
    if (up) d.up = true;
    if (dn) d.down = true;
    if (left) d.left = true;
    if (right) d.right = true;
    if (k('KeyM')) d.mute = true;
    if (Object.values(this.keys).some(Boolean)) this.lastActivity = performance.now();
    this.latch = {};

    // --- dotyk (telefon/tablet) ---
    // Gaz jedzie sam, gracz tylko skreca - na malym ekranie wiecej przyciskow
    // niz palcow. Srodkowy pas ekranu = hamulec.
    this.tapPoint = this.pendingTap || null;   // tap zyje dokladnie jedna klatke
    this.pendingTap = null;
    if (this.touchUsed) {
      let s = 0, braking = false;
      for (const t of this.touches) {
        if (t.x < W * 0.40) s -= 1;
        else if (t.x > W * 0.60) s += 1;
        else braking = true;
      }
      steer = clamp(s, -1, 1);
      brake = braking ? 1 : 0;
      accel = braking ? 0 : 1;
      if (this.tapLatch) { d.start = true; d.ok = true; }
    }
    this.tapLatch = false;

    // Wejscia cyfrowe (dotyk, klawiatura, d-pad) wygladzamy - bez tego auto
    // szarpie na pelen wychyl w jednej klatce. Analog z drazka idzie bez zmian.
    const target = clamp(steer, -1, 1);
    if (digital) {
      const rate = target === 0 ? 0.35 : 0.2;
      this.steer = clamp(this.steer + (target - this.steer) * rate, -1, 1);
      if (Math.abs(this.steer) < 0.02) this.steer = 0;
    } else {
      this.steer = target;
    }
    this.accel = clamp(accel, 0, 1);
    this.brake = clamp(brake, 0, 1);
    this.down = d;
  },

  pressed(name) { return this.down[name] && !this.prev[name]; },
  consumeTap() { const p = this.tapPoint; this.tapPoint = null; return p; },
  idleMs() { return performance.now() - this.lastActivity; }
};

// ------------------------------------------------------------------ sprites
// Wszystko rysowane proceduralnie - zero plikow graficznych, dziala offline.

function drawShadow(ctx, x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + h * 0.97, w * 0.46, h * 0.09, 0, 0, PI * 2);
  ctx.fill();
}

function drawCar(ctx, x, y, w, h, c, opts) {
  opts = opts || {};
  drawShadow(ctx, x, y, w, h);
  // kola
  ctx.fillStyle = INK;
  ctx.fillRect(x + w * 0.005, y + h * 0.56, w * 0.15, h * 0.38);
  ctx.fillRect(x + w * 0.845, y + h * 0.56, w * 0.15, h * 0.38);
  // nadwozie
  ctx.fillStyle = c.body;
  ctx.fillRect(x + w * 0.05, y + h * 0.28, w * 0.90, h * 0.64);
  // dach
  ctx.fillStyle = c.roof || c.body;
  ctx.fillRect(x + w * 0.17, y + h * 0.02, w * 0.66, h * 0.46);
  // szyba
  ctx.fillStyle = c.glass;
  ctx.fillRect(x + w * 0.22, y + h * 0.09, w * 0.56, h * 0.26);
  // swiatla
  ctx.fillStyle = c.light;
  ctx.fillRect(x + w * 0.09, y + h * 0.50, w * 0.22, h * 0.10);
  ctx.fillRect(x + w * 0.69, y + h * 0.50, w * 0.22, h * 0.10);
  // zderzak
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(x + w * 0.07, y + h * 0.80, w * 0.86, h * 0.08);
  if (opts.boost) {
    ctx.fillStyle = BRAND;
    ctx.fillRect(x + w * 0.22, y + h * 0.90, w * 0.56, h * 0.05);
  }
}

// Slupek z ladowarka - wspolna podstawa dla obu produktow.
function drawStand(ctx, x, y, w, h, t) {
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.006);
  ctx.globalAlpha = 0.25 + 0.35 * pulse;
  ctx.fillStyle = BRAND;
  ctx.fillRect(x - w * 0.25, y + h * 0.95, w * 1.5, h * 0.05);
  ctx.globalAlpha = 1;
  ctx.fillStyle = INK;
  ctx.fillRect(x + w * 0.20, y + h * 0.90, w * 0.60, h * 0.10);   // podstawa
  ctx.fillStyle = '#C9CED8';
  ctx.fillRect(x + w * 0.40, y + h * 0.45, w * 0.20, h * 0.47);   // slup
}

// Ekspozytor przy trasie: biala kartka ze zdjeciem produktu i podpisem.
// Zdjecia produktowe maja jasne tlo, wiec kartka jest dla nich naturalna
// oprawa - inaczej wisialby w powietrzu bialy prostokat.
function drawProductStand(ctx, x, y, w, h, t, ref, name, fallback) {
  drawStand(ctx, x, y, w, h, t);

  const cw = w * 0.94, cx = x + (w - cw) / 2, cy = y, chh = h * 0.46;
  ctx.fillStyle = PAPER;
  ctx.fillRect(cx, cy, cw, chh);

  const barH = chh * 0.20;
  const pad = cw * 0.07;
  const ix = cx + pad, iy = cy + pad;
  const iw = cw - pad * 2, ih = chh - barH - pad * 1.6;

  if (ref.ready) {
    // Zdjecia sklepowe maja spory bialy margines, a produkt ma byc czytelny
    // z daleka - stad lekkie przyblizenie i przyciecie do kartki.
    const ar = ref.img.naturalWidth / ref.img.naturalHeight;
    let dw = iw, dh = iw / ar;
    if (dh > ih) { dh = ih; dw = ih * ar; }
    dw *= 1.2; dh *= 1.2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(ix, iy, iw, ih);
    ctx.clip();
    ctx.drawImage(ref.img, ix + (iw - dw) / 2, iy + (ih - dh) / 2, dw, dh);
    ctx.restore();
  } else {
    fallback(ctx, ix, iy, iw, ih);
  }

  ctx.fillStyle = BRAND;
  ctx.fillRect(cx, cy + chh - barH, cw, barH);
  if (cw > 54) {
    ctx.fillStyle = PAPER;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.floor(barH * 0.62) + 'px Geist, Arial, sans-serif';
    ctx.fillText(name, cx + cw / 2, cy + chh - barH * 0.46);
  }
}

function drawTree(ctx, x, y, w, h) {
  // Plaska sylwetka w akcencie z motywu - tlo, nie bohater kadru.

  ctx.fillRect(x + w * 0.45, y + h * 0.70, w * 0.10, h * 0.30);
  ctx.fillStyle = 'rgba(51,79,180,0.26)';
  for (let i = 0; i < 3; i++) {
    const top = y + h * (0.02 + i * 0.22);
    const half = w * (0.22 + i * 0.13);
    ctx.beginPath();
    ctx.moveTo(x + w * 0.5, top);
    ctx.lineTo(x + w * 0.5 + half, top + h * 0.30);
    ctx.lineTo(x + w * 0.5 - half, top + h * 0.30);
    ctx.closePath(); ctx.fill();
  }
}

  ctx.fillRect(x + w * 0.44, y + h * 0.08, w * 0.07, h * 0.92);

// ---------------------------------------------------------------- budowa trasy
let segments = [];
let trackLength = 0;

const ROAD = {
  LENGTH: { NONE: 0, SHORT: 25, MEDIUM: 50, LONG: 100 },
  HILL:   { NONE: 0, LOW: 20, MEDIUM: 40, HIGH: 60 },
  CURVE:  { NONE: 0, EASY: 2, MEDIUM: 4, HARD: 6 }
};

function lastY() { return segments.length === 0 ? 0 : segments[segments.length - 1].p2.world.y; }

function addSegment(curve, y) {
  const n = segments.length;
  const isCharge = Math.floor(n / CFG.rumbleLength) % 12 === 0;
  segments.push({
    index: n,
    p1: { world: { y: lastY(), z: n * CFG.segmentLength }, camera: {}, screen: {} },
    p2: { world: { y: y, z: (n + 1) * CFG.segmentLength }, camera: {}, screen: {} },
    curve: curve,
    sprites: [],
    cars: [],
    color: isCharge ? COLORS.charge
         : (Math.floor(n / CFG.rumbleLength) % 2 ? COLORS.dark : COLORS.light)
  });
}

function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY();
  const endY = startY + (y || 0) * CFG.segmentLength;
  const total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
  for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
}

const addStraight = (n) => addRoad(n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, 0, 0);
const addCurve = (n, c, h) => addRoad(n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, c || ROAD.CURVE.MEDIUM, h || 0);
const addHill = (n, h) => addRoad(n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, 0, h || ROAD.HILL.MEDIUM);

function addSCurves() {
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY, ROAD.HILL.NONE);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.CURVE.EASY, -ROAD.HILL.LOW);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY, ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.MEDIUM, -ROAD.HILL.MEDIUM);
}

function addBumps() {
  [5, -2, -5, 8, 5, -7, 5, -2].forEach((h) => addRoad(10, 10, 10, 0, h));
}

function addLowRollingHills(n, h) {
  n = n || ROAD.LENGTH.SHORT; h = h || ROAD.HILL.LOW;
  addRoad(n, n, n, 0, h / 2);
  addRoad(n, n, n, 0, -h);
  addRoad(n, n, n, ROAD.CURVE.EASY, h);
  addRoad(n, n, n, 0, 0);
  addRoad(n, n, n, -ROAD.CURVE.EASY, h / 2);
  addRoad(n, n, n, 0, 0);
}

function addScenery() {
  const n = segments.length;
  // pobocze: drzewa, lampy, billboardy
  for (let i = 20; i < n - 20; i++) {
    const s = segments[i];
    if (i % 40 === 0) {
      s.sprites.push({ sprite: SPR.lampL, offset: -1.3 });
      s.sprites.push({ sprite: SPR.lampR, offset: 1.3 });
    }
    if (i % 13 === 0 && Math.random() < 0.6) {
      const side = Math.random() < 0.5 ? -1 : 1;
      s.sprites.push({ sprite: pick([SPR.tree, SPR.treeS]), offset: side * rnd(1.9, 4.6) });
    }
    if (i % 180 === 40) s.sprites.push({ sprite: SPR.billboard, offset: (Math.random() < 0.5 ? -1 : 1) * 1.9 });
    if (i % 260 === 90) s.sprites.push({ sprite: SPR.gantry, offset: 0 });
  }
  // ladowarki + pachołki na jezdni; produkty lecą na przemian
  let i = 120;
  let alt = 0;
  while (i < n - 120) {
    const lane = pick([-0.62, 0, 0.62]);
    const charger = (alt++ % 2 === 0) ? SPR.prime : SPR.q11;
    segments[i].sprites.push({ sprite: charger, offset: lane, kind: 'pickup', takenAt: -1e9 });
    // czasem pachołek w innym pasie tuz obok - zmusza do wyboru toru
    if (Math.random() < 0.55) {
      const other = pick([-0.62, 0, 0.62].filter((l) => l !== lane));
      segments[i + rndInt(4, 14)].sprites.push({ sprite: SPR.cone, offset: other, kind: 'cone' });
    }
    // Dodatkowe przeszkody czekaja na wyzsze poziomy - ta sama trasa
    // robi sie wtedy ciasniejsza, bez przebudowywania jej w locie.
    for (const lvl of [2, 3, 4]) {
      if (Math.random() < 0.5) {
        const seg = segments[i + rndInt(20, 110)];
        if (seg) seg.sprites.push({ sprite: SPR.cone, offset: pick([-0.62, 0, 0.62]), kind: 'cone', minLevel: lvl });
      }
    }
    i += rndInt(140, 260);
  }
}

// Dlugosc trasy wynika z tego, ze okrazenie konczy poziom: przy ~45 s
// nawet sredni gracz zobaczy LEVEL 2, a dobry dojedzie do 4-5.
function buildTrack() {
  segments = [];
  addStraight(ROAD.LENGTH.SHORT);
  addLowRollingHills();
  addSCurves();
  addCurve(ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.LOW);
  addBumps();
  addCurve(ROAD.LENGTH.LONG, -ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
  addHill(ROAD.LENGTH.MEDIUM, ROAD.HILL.HIGH);
  addStraight(ROAD.LENGTH.SHORT);
  // wyrownanie do zera zeby petla sie zgadzala
  addRoad(150, 150, 150, ROAD.CURVE.EASY, -lastY() / CFG.segmentLength);
  addScenery();
  trackLength = segments.length * CFG.segmentLength;
}

function findSegment(z) {
  return segments[Math.floor(z / CFG.segmentLength) % segments.length];
}

// ------------------------------------------------------------------ ruch aut
let cars = [];

function resetCars(count) {
  cars = [];
  for (let i = 0; i < count; i++) {
    cars.push({
      offset: rnd(-0.75, 0.75),
      z: Math.floor(Math.random() * segments.length) * CFG.segmentLength,
      speed: rnd(maxSpeed / 5, maxSpeed / 2.1),
      skin: pick(CAR_SKINS),
      w: TRAFFIC_W
    });
  }
  syncCarSegments();
}

function syncCarSegments() {
  segments.forEach((s) => s.cars.length = 0);
  cars.forEach((c) => findSegment(c.z).cars.push(c));
}

function updateCars(dt, playerSeg, playerW) {
  cars.forEach((car) => {
    const oldSeg = findSegment(car.z);
    car.offset += carSteer(car, oldSeg, playerSeg, playerW) * dt;
    car.offset = clamp(car.offset, -0.9, 0.9);
    car.z = (car.z + dt * car.speed) % trackLength;
    if (car.z < 0) car.z += trackLength;
    const newSeg = findSegment(car.z);
    if (oldSeg !== newSeg) {
      const i = oldSeg.cars.indexOf(car);
      if (i >= 0) oldSeg.cars.splice(i, 1);
      newSeg.cars.push(car);
    }
  });
}

function carSteer(car, carSeg, playerSeg, playerW) {
  const lookahead = 20;
  const carW = car.w / CFG.roadWidth;
  // unik przed graczem
  if ((carSeg.index - playerSeg.index) > lookahead) return 0;
  for (let i = 1; i < lookahead; i++) {
    const seg = segments[(carSeg.index + i) % segments.length];
    if (seg === playerSeg && player.speed > car.speed &&
        overlap(player.x, playerW / CFG.roadWidth, car.offset, carW, 1.2)) {
      if (player.x > car.offset) return -0.9;
      if (player.x < car.offset) return 0.9;
      return car.offset > 0 ? -0.9 : 0.9;
    }
    for (const other of seg.cars) {
      if (other === car) continue;
      if (car.speed > other.speed && overlap(car.offset, carW, other.offset, other.w / CFG.roadWidth, 1.2)) {
        if (other.offset > car.offset) return -0.7;
        return 0.7;
      }
    }
  }
  return 0;
}

// --------------------------------------------------------- tablica zdalna
// Online: wyniki sa wspolne dla calego stoiska, nick przychodzi z telefonu.
// Offline: wszystko leci na lokalna tablice jak dotad. Padniete wifi na
// targach nie moze oznaczac padnietego stanowiska.
let remoteBoard = null;
let remoteBoardAt = -1e9;   // nie blokuj pierwszego pobrania tuz po starcie
let runCode = null;
let runCodeErr = null;
let qrCanvas = null;

async function fetchBoard() {
  if (performance.now() - remoteBoardAt < 12000) return;
  remoteBoardAt = performance.now();
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch('/api/board?limit=10', { signal: ctl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error('http');
    const data = await r.json();
    remoteBoard = Array.isArray(data.board) ? data.board : null;
  } catch (e) {
    remoteBoard = null;
  }
}

function boardRows() {
  if (remoteBoard && remoteBoard.length) {
    return remoteBoard.map((r) => ({ name: r.nick, score: r.score, level: r.level }));
  }
  return scores.slice().sort((a, b) => b.score - a.score);
}

// Ktore miejsce zajalby wynik gracza. Zwraca 0, gdy nie ma z czym porownac.
function wouldBeRank(score) {
  const rows = boardRows();
  if (!rows.length) return 0;
  return rows.filter((r) => r.score > score).length + 1;
}

async function requestRunCode() {
  runCode = null;
  runCodeErr = null;
  qrCanvas = null;
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch('/api/run', {
      method: 'POST',
      signal: ctl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        score: Math.floor(player.score),
        distance: Math.floor(player.travelled / CFG.distDivisor),
        pickups: player.pickups,
        level: player.level
      })
    });
    clearTimeout(t);
    if (!r.ok) throw new Error('http_' + r.status);
    const data = await r.json();
    if (!data.code) throw new Error('no_code');
    runCode = data.code;
    qrCanvas = makeQR(location.origin + '/w.html?c=' + data.code);
    if (!qrCanvas) throw new Error('qr_failed');
    remoteBoardAt = 0;   // tablica odswiezy sie zaraz po zapisie
  } catch (e) {
    runCodeErr = String(e.message || e);
  }
}

// Kod QR rysujemy raz na offscreen canvas i tylko skalujemy przy rysowaniu.
function makeQR(url) {
  if (typeof qrcode !== 'function') return null;
  try {
    const q = qrcode(0, 'M');
    q.addData(url);
    q.make();
    const n = q.getModuleCount();
    const quiet = 4;
    const size = n + quiet * 2;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const cx = c.getContext('2d');
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, size, size);
    cx.fillStyle = '#121212';
    for (let row = 0; row < n; row++) {
      for (let col = 0; col < n; col++) {
        if (q.isDark(row, col)) cx.fillRect(col + quiet, row + quiet, 1, 1);
      }
    }
    return c;
  } catch (e) {
    return null;
  }
}

function loadScores() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    scores = raw ? JSON.parse(raw) : [];
  } catch (e) { scores = []; }
  if (!Array.isArray(scores)) scores = [];
  if (scores.length === 0) {
    scores = [
      { name: 'AMP', score: 9000 }, { name: 'EVX', score: 7400 }, { name: 'KTW', score: 6100 },
      { name: 'WAT', score: 4800 }, { name: 'KWH', score: 3500 }
    ];
  }
}
function saveScores() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(scores.slice(0, 10))); } catch (e) {}
}
function rankFor(score) {
  const list = scores.slice().sort((a, b) => b.score - a.score);
  for (let i = 0; i < 10; i++) {
    if (!list[i] || score > list[i].score) return i;
  }
  return -1;
}

}

// ---------------------------------------------------------------- rendering
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, projW = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2);
  W = Math.floor(window.innerWidth);
  H = Math.floor(window.innerHeight);
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // geometria trzymana w proporcji ~16:9, zeby ultrawide nie rozciagalo drogi
  projW = Math.min(W, H * 1.9);
}
window.addEventListener('resize', resize);

function project(p, camX, camY, camZ) {
  p.camera.x = (p.world.x || 0) - camX;
  p.camera.y = (p.world.y || 0) - camY;
  p.camera.z = (p.world.z || 0) - camZ;
  p.screen.scale = cameraDepth / p.camera.z;
  p.screen.x = Math.round((W / 2) + (p.screen.scale * p.camera.x * projW / 2));
  p.screen.y = Math.round((H / 2) - (p.screen.scale * p.camera.y * H / 2));
  p.screen.w = Math.round(p.screen.scale * CFG.roadWidth * projW / 2);
}

function polygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}

function renderSegment(x1, y1, w1, x2, y2, w2, color) {
  const lanes = CFG.lanes;
  const r1 = w1 / 14, r2 = w2 / 14;
  const l1 = w1 / Math.max(32, 8 * lanes), l2 = w2 / Math.max(32, 8 * lanes);

  ctx.fillStyle = color.grass;
  ctx.fillRect(0, y2, W, y1 - y2);

  polygon(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, color.rumble);
  polygon(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, color.rumble);
  polygon(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, color.road);

  if (color.lane) {
    const lw1 = w1 * 2 / lanes, lw2 = w2 * 2 / lanes;
    let lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
    for (let lane = 1; lane < lanes; lane++) {
      polygon(lx1 - l1 / 2, y1, lx1 + l1 / 2, y1, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2, color.lane);
      lx1 += lw1; lx2 += lw2;
    }
  }
}

function renderSprite(sprite, scale, destX, destY, offsetX, offsetY, clipY, extra) {
  const destW = sprite.w * scale * projW / 2;
  const destH = destW * (sprite.h / sprite.w);
  if (destW < 1 || destH < 1) return;
  const x = destX + destW * (offsetX || 0);
  const y = destY + destH * (offsetY || 0);
  if (x > W + destW || x + destW < -destW) return;

  const clipH = clipY ? Math.max(0, y + destH - clipY) : 0;
  if (clipH >= destH) return;

  ctx.save();
  if (clipH > 0) {
    ctx.beginPath();
    ctx.rect(0, 0, W, y + destH - clipH);
    ctx.clip();
  }
  sprite.draw(ctx, x, y, destW, destH, extra || 0);
  ctx.restore();
}

function renderSky() {
  const horizon = H * 0.5;
  const g = ctx.createLinearGradient(0, 0, 0, horizon + H * 0.1);
  g.addColorStop(0, '#DCE3F2');
  g.addColorStop(0.55, '#EDF1F8');
  g.addColorStop(1, PAPER);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizon + H * 0.14);

  // dalekie wzgorza - plaskie sylwetki w akcencie z motywu
  const hills = [
    { c: 'rgba(51,79,180,0.14)', amp: 0.085, par: 0.45, step: 11, seed: 1.7 },
    { c: 'rgba(51,79,180,0.22)', amp: 0.055, par: 0.8, step: 8, seed: 3.1 }
  ];
  hills.forEach((h) => {
    ctx.fillStyle = h.c;
    ctx.beginPath();
    ctx.moveTo(-W, horizon + 2);
    const step = W / h.step;
    for (let i = -2; i <= h.step + 4; i++) {
      const px = i * step - (skyOffset * h.par) % (step * 2);
      const ph = H * (h.amp * 0.4 + h.amp * Math.abs(Math.sin(i * h.seed)));
      ctx.lineTo(px, horizon + 2 - ph);
      ctx.lineTo(px + step / 2, horizon + 2);
    }
    ctx.lineTo(W * 2, horizon + 2);
    ctx.closePath(); ctx.fill();
  });

  // zabudowa na horyzoncie - proste bloki, bez detalu
  ctx.fillStyle = 'rgba(18,18,18,0.16)';
  for (let i = -2; i <= 28; i++) {
    const bw = W / 26;
    const bx = i * bw - (skyOffset * 1.1) % (bw * 4);
    const bh = H * (0.015 + 0.04 * Math.abs(Math.sin(i * 2.3 + 1)));
    ctx.fillRect(bx, horizon + 2 - bh, bw * 0.7, bh);
  }

  // linia horyzontu
  ctx.fillStyle = 'rgba(18,18,18,0.18)';
  ctx.fillRect(0, horizon, W, 1);
}

let skyOffset = 0;

function render() {
  const baseSegment = findSegment(player.position);
  const basePercent = (player.position % CFG.segmentLength) / CFG.segmentLength;
  const playerSegment = findSegment(player.position + playerZ);
  const playerPercent = ((player.position + playerZ) % CFG.segmentLength) / CFG.segmentLength;
  const playerY = lerp(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);
  const speedPct = player.speed / maxSpeed;

  ctx.save();
  if (player.shake > 0) {
    ctx.translate(rnd(-1, 1) * player.shake, rnd(-1, 1) * player.shake);
  }

  ctx.fillStyle = PAPER;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  renderSky();

  let maxy = H;
  let x = 0;
  let dx = -(baseSegment.curve * basePercent);

  // --- droga ---
  for (let n = 0; n < CFG.drawDistance; n++) {
    const seg = segments[(baseSegment.index + n) % segments.length];
    seg.looped = seg.index < baseSegment.index;
    seg.fog = fogAt(n / CFG.drawDistance, CFG.fogDensity);
    seg.clip = maxy;

    const camZ = player.position - (seg.looped ? trackLength : 0);
    project(seg.p1, (player.x * CFG.roadWidth) - x, playerY + CFG.cameraHeight, camZ);
    project(seg.p2, (player.x * CFG.roadWidth) - x - dx, playerY + CFG.cameraHeight, camZ);

    x += dx;
    dx += seg.curve;

    if (seg.p1.camera.z <= cameraDepth || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;

    renderSegment(seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w,
                  seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w, seg.color);

    if (seg.fog < 1) {
      ctx.globalAlpha = 1 - seg.fog;
      ctx.fillStyle = '#EDF1F8';
      ctx.fillRect(0, seg.p2.screen.y, W, seg.p1.screen.y - seg.p2.screen.y);
      ctx.globalAlpha = 1;
    }
    maxy = seg.p2.screen.y;
  }

  // --- sprite'y i auta: od tylu do przodu ---
  const now = performance.now();
  for (let n = CFG.drawDistance - 1; n > 0; n--) {
    const seg = segments[(baseSegment.index + n) % segments.length];
    if (!seg.p1.screen.scale || seg.p1.camera.z <= cameraDepth) continue;

    for (const car of seg.cars) {
      const pct = ((car.z % CFG.segmentLength) / CFG.segmentLength);
      const scale = lerp(seg.p1.screen.scale, seg.p2.screen.scale, pct);
      const sx = lerp(seg.p1.screen.x, seg.p2.screen.x, pct);
      const sy = lerp(seg.p1.screen.y, seg.p2.screen.y, pct);
      const sw = lerp(seg.p1.screen.w, seg.p2.screen.w, pct);
      const sprite = { w: car.w, h: car.w * 0.92, draw: (c, x0, y0, w0, h0) => drawCar(c, x0, y0, w0, h0, car.skin) };
      renderSprite(sprite, scale, sx + sw * car.offset, sy, -0.5, -1, seg.clip);
    }

    for (const sp of seg.sprites) {
      if (sp.minLevel && player.level < sp.minLevel) continue;
      if (sp.kind === 'pickup' && now - sp.takenAt < 9000) continue;
      renderSprite(sp.sprite, seg.p1.screen.scale,
                   seg.p1.screen.x + seg.p1.screen.w * sp.offset,
                   seg.p1.screen.y, -0.5, -1, seg.clip, now);
    }
  }

  // --- gracz ---
  // Auto gracza ma staly rozmiar ekranowy (jak w klasycznych arcade'ach),
  // nie skaluje sie rzutem perspektywicznym - inaczej zaslania pol ekranu.
  const pScale = cameraDepth / playerZ;
  const pDestY = (H / 2) - (pScale * lerp(playerSegment.p1.camera.y, playerSegment.p2.camera.y, playerPercent) * H / 2);
  const bounce = speedPct > 0.02 ? (1.4 * Math.random() * speedPct) * pick([-1, 1]) : 0;
  const lean = Input.steer * speedPct;
  const blink = player.hitCooldown > 0 && Math.floor(player.hitCooldown * 16) % 2 === 0;
  if ((state === 'play' || state === 'countdown') && !blink) {
    const omoda = player.level >= OMODA_LEVEL;
    const cw = projW * (omoda ? 0.215 : 0.195);
    const ch = cw * (omoda ? 1.0 : 0.94);
    const cx = W / 2 - cw / 2;
    const cy = Math.min(pDestY + bounce, H * 0.985) - ch;   // nie wychodz poza dolna krawedz
    ctx.save();
    ctx.translate(W / 2, cy + ch);
    ctx.rotate(-lean * 0.05);
    ctx.translate(-W / 2, -(cy + ch));
    if (omoda) drawOmoda(ctx, cx, cy, cw, ch, OMODA_SKIN, { boost: speedPct > 0.75 });
    else drawCar(ctx, cx, cy, cw, ch, PLAYER_SKIN, { boost: speedPct > 0.75 });
    ctx.restore();
  }

  ctx.restore();

  // --- bliski flash na zderzeniu / ladowaniu ---
  if (player.flashRed > 0) {
    ctx.fillStyle = 'rgba(220,40,40,' + (player.flashRed * 0.45).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (player.flashBrand > 0) {
    ctx.fillStyle = 'rgba(255,107,0,' + (player.flashBrand * 0.30).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

// -------------------------------------------------------------------- HUD/UI
function setFont(size, weight, mono) {
  ctx.font = (weight || 600) + ' ' + Math.round(size) + 'px ' +
    (mono ? '"Geist Mono", "SF Mono", Consolas, monospace' : '"Geist", "Segoe UI", Arial, sans-serif');
}

function text(str, x, y, opts) {
  opts = opts || {};
  setFont(opts.size || 20, opts.weight, opts.mono);
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'alphabetic';
  if (opts.spacing !== undefined && 'letterSpacing' in ctx) ctx.letterSpacing = opts.spacing + 'px';
  if (opts.shadow) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(str, x + (opts.shadow), y + (opts.shadow));
  }
  ctx.fillStyle = opts.color || '#fff';
  ctx.fillText(str, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function logo(x, y, h, align) {
  const ar = (logoReady && logoImg.naturalWidth) ? logoImg.naturalWidth / logoImg.naturalHeight : 4.05;
  const w = h * ar;
  drawLogoInto(ctx, align === 'center' ? x - w / 2 : x, y - h / 2, w, h);
}

function batteryBar(x, y, w, h, pct) {
  const p = clamp(pct / 100, 0, 1);
  const low = pct < 25;
  const pulse = low ? 0.4 + 0.6 * Math.abs(Math.sin(performance.now() * 0.008)) : 1;
  ctx.fillStyle = GREY;
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = low ? '#D93025' : BRAND;
  if (p > 0.001) ctx.fillRect(x, y, Math.max(3, w * p), h);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  // podzialka co 25%
  ctx.fillStyle = 'rgba(18,18,18,0.25)';
  for (let i = 1; i < 4; i++) ctx.fillRect(x + (w / 4) * i, y, 1, h);
}

function renderHUD() {
  const pad = Math.round(Math.min(W, H) * 0.028);
  const u = Math.min(W, H) / 100;   // jednostka skalowania UI

  // panel gorny: biel, kreska, zero zaokraglen
  const barH = u * 12;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = INK;
  ctx.fillRect(0, barH, W, 1);

  logo(pad, u * 4.2, u * 3);
  batteryBar(pad, u * 7.4, u * 26, u * 2.6, player.battery);
  text('BATERIA ' + Math.ceil(player.battery) + '%', pad + u * 27.5, u * 9.5,
       { size: u * 1.9, color: player.battery < 25 ? '#D93025' : MUTED, mono: true, weight: 600 });

  // poziom
  const lvW = u * 13, lvX = pad + u * 46;
  ctx.fillStyle = INK;
  ctx.fillRect(lvX, u * 2.4, lvW, u * 7.4);
  text('LEVEL', lvX + lvW / 2, u * 5, { size: u * 1.4, color: '#9AA3B2', align: 'center', spacing: 2 });
  text(String(player.level), lvX + lvW / 2, u * 8.6,
       { size: u * 3.6, color: PAPER, align: 'center', mono: true, weight: 700 });

  // zycia
  const liX = lvX + lvW + u * 2.5;
  text('ŻYCIA', liX, u * 4.4, { size: u * 1.4, color: MUTED, spacing: 2 });
  for (let i = 0; i < LIVES; i++) {
    const cx = liX + i * u * 3.4, cy = u * 6.2, cw2 = u * 2.6, ch2 = u * 3;
    if (i < player.lives) {
      ctx.fillStyle = BRAND;
      ctx.fillRect(cx, cy, cw2, ch2);
      ctx.fillStyle = PAPER;
      ctx.fillRect(cx + cw2 * 0.18, cy + ch2 * 0.18, cw2 * 0.64, ch2 * 0.3);
    } else {
      ctx.strokeStyle = LINE; ctx.lineWidth = 1;
      ctx.strokeRect(cx + 0.5, cy + 0.5, cw2 - 1, ch2 - 1);
    }
  }

  // wynik
  text('WYNIK', W - pad, u * 3.6, { size: u * 1.6, color: MUTED, align: 'right', spacing: 2.5 });
  text(String(Math.floor(player.score)).padStart(6, '0'), W - pad, u * 9.6,
       { size: u * 5.2, color: INK, align: 'right', mono: true, weight: 700 });

  // mnoznik
  if (player.streak > 1) {
    const m = multiplier();
    const bw = u * 16, bx = W / 2 - bw / 2;
    ctx.fillStyle = BRAND;
    ctx.fillRect(bx, u * 2.2, bw, u * 7.6);
    text('x' + m, W / 2, u * 7.6, { size: u * 4.6, color: PAPER, align: 'center', weight: 700 });
    text('SERIA ' + player.streak, W / 2, barH + u * 3, { size: u * 1.6, color: INK, align: 'center', spacing: 2 });
  }

  // Predkosc i dystans na bialych plytkach - jezdnia jest ciemna,
  // sam tekst gubilby sie na niej.
  const kmh = Math.round((player.speed / maxSpeed) * CFG.topSpeedKmh);
  const spW = u * 22, spH = u * 11;
  ctx.fillStyle = PAPER;
  ctx.fillRect(W - pad - spW, H - pad - spH, spW, spH);
  ctx.fillStyle = BRAND;
  ctx.fillRect(W - pad - spW, H - pad - spH, spW, u * 0.5);
  text(String(kmh), W - pad - u * 1.2, H - pad - u * 3.4,
       { size: u * 7, color: INK, align: 'right', mono: true, weight: 700 });
  text('km/h', W - pad - u * 1.2, H - pad - u * 1.2,
       { size: u * 1.8, color: MUTED, align: 'right', spacing: 1 });

  const dsW = u * 18, dsH = u * 5.4;
  ctx.fillStyle = PAPER;
  ctx.fillRect(pad, H - pad - dsH, dsW, dsH);
  text('DYSTANS', pad + u * 1.2, H - pad - dsH + u * 2, { size: u * 1.4, color: MUTED, spacing: 2 });
  text(Math.floor(player.travelled / CFG.distDivisor) + ' m', pad + u * 1.2, H - pad - u * 1.2,
       { size: u * 2.6, color: INK, mono: true, weight: 700 });

  // popupy punktowe - plytka w kolorze zdarzenia, tekst wyciety na bialo
  popups.forEach((p) => {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    const fs = u * (p.big ? 3.4 : 2.6);
    setFont(fs, 700, true);
    const tw = ctx.measureText(p.txt).width;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - tw / 2 - u * 1.2, p.y - fs, tw + u * 2.4, fs * 1.45);
    text(p.txt, p.x, p.y + fs * 0.1, { size: fs, color: PAPER, align: 'center', mono: true, weight: 700 });
    ctx.globalAlpha = 1;
  });

  // strefy dotyku - widoczne mocno na starcie, potem ledwo
  if (Input.touchUsed) {
    const fade = state === 'play' ? clamp(1 - (stateT - 4) / 3, 0.12, 1) : 1;
    ctx.globalAlpha = fade * 0.65;
    ['◀', '▶'].forEach((g, i) => {
      const x = i ? W * 0.88 : W * 0.12;
      const active = i ? Input.steer > 0.3 : Input.steer < -0.3;
      const s = u * 12;
      ctx.fillStyle = active ? BRAND : PAPER;
      ctx.fillRect(x - s / 2, H * 0.62 - s / 2, s, s);
      text(g, x, H * 0.62 + u * 2.2, { size: u * 6, color: active ? PAPER : INK, align: 'center' });
    });
    ctx.globalAlpha = 1;
  }

  // baner awansu
  if (levelBanner > 0) {
    const reward = player.level === OMODA_LEVEL;
    const withPhoto = reward && imgOmoda.ready;
    const p = clamp(levelBanner / (reward ? 4 : 2.4), 0, 1);
    const slide = (1 - Math.min(1, ((reward ? 4 : 2.4) - levelBanner) * 4)) * u * 8;
    ctx.globalAlpha = Math.min(1, p * 2.5);
    const bh = u * (withPhoto ? 34 : 16), by = H * (withPhoto ? 0.22 : 0.30) + slide;
    ctx.fillStyle = INK;
    ctx.fillRect(0, by, W, bh);
    ctx.fillStyle = BRAND;
    ctx.fillRect(0, by + bh - u * 1.2, W, u * 1.2);

    if (reward) {
      text('OMODA 9 ODBLOKOWANA', W / 2, by + u * 7,
           { size: u * 6.4, color: PAPER, align: 'center', spacing: 5, weight: 900 });
      if (withPhoto) {
        const ph = u * 18, pw = ph * (imgOmoda.img.naturalWidth / imgOmoda.img.naturalHeight);
        ctx.drawImage(imgOmoda.img, W / 2 - pw / 2, by + u * 10, pw, ph);
      }
      text('NOWA FURA · LEVEL 9', W / 2, by + bh - u * 3.4,
           { size: u * 2.2, color: BRAND, align: 'center', spacing: 4 });
    } else {
      text('LEVEL ' + player.level, W / 2, by + u * 8,
           { size: u * 8, color: PAPER, align: 'center', spacing: 6, weight: 900 });
      text('SZYBCIEJ · WIĘCEJ RUCHU · +' + (LEVEL.bonus * (player.level - 1)) + ' PKT',
           W / 2, by + u * 12.6, { size: u * 2, color: BRAND, align: 'center', spacing: 3 });
    }
    ctx.globalAlpha = 1;
  }

  // ostrzezenie o baterii
  if (player.battery < 20 && Math.floor(performance.now() / 350) % 2 === 0) {
    const msg = 'NISKA BATERIA — ŁAP ŁADOWARKI';
    setFont(u * 2.8, 700);
    const tw = ctx.measureText(msg).width + u * 5;
    ctx.fillStyle = '#D93025';
    ctx.fillRect(W / 2 - tw / 2, H * 0.76, tw, u * 5.4);
    text(msg, W / 2, H * 0.76 + u * 3.6, { size: u * 2.8, color: PAPER, align: 'center', spacing: 2, weight: 700 });
  }
}

function padGlyph(x, y, r, label) {
  ctx.fillStyle = GREY;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.strokeStyle = INK; ctx.lineWidth = 1;
  ctx.strokeRect(x - r + 0.5, y - r + 0.5, r * 2 - 1, r * 2 - 1);
  text(label, x, y + r * 0.36, { size: r * 0.95, color: INK, align: 'center', weight: 700 });
}

function renderControlsHint(cx, cy, u) {
  const items = IS_TOUCH ? [
    { g: '◀', t: 'DOTKNIJ LEWEJ STRONY' },
    { g: '▮', t: 'ŚRODEK — HAMULEC' },
    { g: '▶', t: 'DOTKNIJ PRAWEJ STRONY' }
  ] : [
    { g: '↔', t: 'LEWY DRĄŻEK — SKRĘT' },
    { g: 'RT', t: 'GAZ  ·  LT — HAMULEC' },
    { g: 'A', t: 'START / POTWIERDŹ' }
  ];
  const gap = u * 24;
  items.forEach((it, i) => {
    const x = cx + (i - 1) * gap;
    padGlyph(x, cy, u * 3, it.g);
    text(it.t, x, cy + u * 6, { size: u * 1.5, color: MUTED, align: 'center', spacing: 1.5 });
  });
}

function renderLeaderboard(cx, top, u, limit) {
  const list = boardRows().slice(0, limit || 5);
  const w = u * 44, x = cx - w / 2;
  text('NAJLEPSI KIEROWCY', cx, top, { size: u * 1.7, color: MUTED, align: 'center', spacing: 3.5 });
  const rowH = u * 3.8;
  list.forEach((s, i) => {
    const ry = top + u * 2 + i * rowH;
    const hot = pendingRank === i && state === 'attract';
    if (hot) { ctx.fillStyle = BRAND; ctx.fillRect(x, ry, w, rowH); }
    else if (i % 2 === 0) { ctx.fillStyle = GREY; ctx.fillRect(x, ry, w, rowH); }
    const col = hot ? PAPER : INK;
    const y = ry + rowH * 0.72;
    text(String(i + 1), x + u * 1.6, y, { size: u * 2.1, color: hot ? PAPER : MUTED, mono: true });
    text(s.name, x + u * 6, y, { size: u * 2.3, color: col, mono: true, spacing: 2, weight: 700 });

// ------------------------------------------------------------------- logika
function multiplier() { return clamp(1 + Math.floor(player.streak / 3), 1, 5); }

function addPopup(txt, color, big) {
  popups.push({ txt, color, big, x: W / 2 + rnd(-40, 40), y: H * 0.56, life: 1.2 });
}

function hitSomething(penalty, msg, costLife) {
  if (player.hitCooldown > 0) return;
  player.speed = Math.max(player.speed * 0.35, 0);
  player.battery = Math.max(0, player.battery - penalty);
  player.streak = 0;
  player.hitCooldown = 1.1;
  player.shake = 16;
  player.flashRed = 1;
  Sfx.crash();

  if (costLife) {
    player.lives--;
    if (player.lives <= 0) {
      player.lives = 0;
      addPopup('AUTO ROZBITE', '#D93025', true);
      endRun('crash');
      return;
    }
    addPopup(msg + ' · ZOSTAŁY ' + player.lives, '#D93025', true);
    return;
  }
  if (msg) addPopup(msg, '#D93025', true);
}

function levelUp() {
  player.level++;
  player.score += LEVEL.bonus * (player.level - 1);
  levelBanner = player.level === OMODA_LEVEL ? 4 : 2.4;

  // dokladamy ruchu, ale nie przestawiamy aut juz na trasie
  const target = Math.min(LEVEL.carsMax, 14 + (player.level - 1) * LEVEL.carsStep);
  while (cars.length < target) {
    const car = {
      offset: rnd(-0.75, 0.75),
      z: Math.floor(Math.random() * segments.length) * CFG.segmentLength,
      speed: rnd(maxSpeed / 5, maxSpeed / 2.1),
      skin: pick(CAR_SKINS),
      w: TRAFFIC_W
    };
    cars.push(car);
    findSegment(car.z).cars.push(car);
  }
  Sfx.levelUp();
}

function collectPylon(sp) {
  sp.takenAt = performance.now();
  player.streak++;
  player.pickups++;
  const m = multiplier();
  const pts = 250 * m;
  player.score += pts;
  player.battery = Math.min(100, player.battery + 22);
  player.flashBrand = 0.9;
  // Nazwa produktu w popupie - gracz przy okazji zapamietuje, co zbiera.
  const name = sp.sprite === SPR.prime ? 'PRIME' : 'Q11';
  addPopup(name + ' +' + pts, BRAND, m > 1);
  Sfx.pickup(player.streak);
}

function updatePlay(dt) {
  const playerSegment = findSegment(player.position + playerZ);
  const speedPct = player.speed / maxSpeed;
  const dx = dt * 2.6 * speedPct;

  // skret + sila odsrodkowa
  player.x += Input.steer * dx;
  player.x -= dx * speedPct * playerSegment.curve * CFG.centrifugal;

  // gaz / hamulec
  if (Input.accel > 0.05) {
    player.speed = accelToward(player.speed, speedCap() * Input.accel, accelRate, dt);
  } else if (Input.brake > 0.05) {
    player.speed = Math.max(0, player.speed + brakeRate * dt * Input.brake);
  } else {
    player.speed = Math.max(0, player.speed + decelRate * dt);
  }

  // pobocze
  const offRoad = Math.abs(player.x) > 1;
  if (offRoad) {
    if (player.speed > offRoadLimit) player.speed = Math.max(offRoadLimit, player.speed + offRoadDecel * dt);
    player.shake = Math.max(player.shake, 4 * speedPct);
    player.battery = Math.max(0, player.battery - 4 * dt);
  }
  player.x = clamp(player.x, -2.6, 2.6);

  // kolizje z autami
  if (player.hitCooldown <= 0) {
    for (const car of playerSegment.cars) {
      if (player.speed > car.speed &&
          overlap(player.x, PLAYER_W / CFG.roadWidth, car.offset, car.w / CFG.roadWidth, 0.85)) {
        hitSomething(8, 'STŁUCZKA', true);
        player.position = (findSegment(player.position + playerZ).p1.world.z - playerZ + trackLength) % trackLength;
        break;
      }
    }
  }

  // sprite'y na jezdni
  const now = performance.now();
  for (const sp of playerSegment.sprites) {
    if (sp.minLevel && player.level < sp.minLevel) continue;
    const halfW = sp.sprite.w / CFG.roadWidth;
    if (!overlap(player.x, PLAYER_W / CFG.roadWidth, sp.offset, halfW, 1.0)) continue;
    if (sp.kind === 'pickup') {
      if (now - sp.takenAt > 9000) collectPylon(sp);
    } else if (sp.kind === 'cone' && player.hitCooldown <= 0) {
      hitSomething(6, 'PACHOŁEK!');
    }
  }

  // ruch do przodu; przewiniecie sie trasy = koniec okrazenia
  const ds = dt * player.speed;
  const before = player.position;
  player.position = (player.position + ds) % trackLength;
  if (player.position < before) levelUp();
  player.travelled += ds;
  player.score += ds / CFG.distDivisor;
  skyOffset += (playerSegment.curve * speedPct * dt * 220) + speedPct * dt * 4;

  // bateria: jazda kosztuje prad
  player.battery -= (0.8 + 2.7 * speedPct) * drainScale() * dt;

  updateCars(dt, playerSegment, PLAYER_W);
  Sfx.engineUpdate(speedPct, offRoad);

  if (player.battery <= 0) {
    player.battery = 0;
    endRun('battery');
  }
}

function updateAttractDemo(dt) {
  // auto jedzie samo w tle ekranu tytulowego
  const seg = findSegment(player.position + playerZ);
  const speedPct = player.speed / maxSpeed;
  player.speed = accelToward(player.speed, maxSpeed * 0.55, accelRate * 0.5, dt);
  const targetX = clamp(-seg.curve * 0.25, -0.7, 0.7);
  player.x = lerp(player.x, targetX, dt * 1.6);
  const ds = dt * player.speed;
  player.position = (player.position + ds) % trackLength;
  skyOffset += (seg.curve * speedPct * dt * 220) + speedPct * dt * 4;
  updateCars(dt, seg, PLAYER_W);
}

function endRun(reason) {
  player.endReason = reason || 'battery';
  Sfx.gameover();
  Sfx.engineUpdate(0, false);
  player.best = Math.max(player.best, Math.floor(player.score));
  pendingRank = rankFor(Math.floor(player.score));
  state = 'saving';
  stateT = 0;
  document.body.classList.remove('playing');
  requestRunCode();
}

// Kod sie nie wyrobil - wracamy do trybu lokalnego z inicjalami na padzie.
function fallbackToLocal() {
  if (pendingRank >= 0) {
    state = 'initials';
    initials = ['A', 'A', 'A'];
    initialIdx = 0;
  } else {
    state = 'gameover';

  stateT = 0;

function startRun() {
  Sfx.resume();
  resetRun();
  state = 'countdown';
  countdown = 3.99;
  stateT = 0;
  pendingRank = -1;
  document.body.classList.add('playing');
}

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-';
function cycleLetter(idx, dir) {
  const cur = ALPHABET.indexOf(initials[idx]);
  const next = (cur + dir + ALPHABET.length) % ALPHABET.length;
  initials[idx] = ALPHABET[next];
  Sfx.ui();
}

function submitInitials() {
  scores.push({ name: initials.join(''), score: Math.floor(player.score) });
  scores = scores.sort((a, b) => b.score - a.score).slice(0, 10);
  saveScores();
  Sfx.start1();
  state = 'gameover';
  stateT = 0;
}

// ---------------------------------------------------------------- petla gry
let last = performance.now();
let acc = 0;
const STEP = 1 / 60;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;   // po przelaczeniu zakladki nie teleportujemy auta
  acc += dt;

  Input.poll();

  while (acc >= STEP) {
    tick(STEP);
    acc -= STEP;
  }

  render();
  if (state === 'play' || state === 'countdown') renderHUD();
  if (state === 'attract') renderAttract();
  if (state === 'countdown') renderCountdown();
  if (state === 'gameover' || state === 'initials') renderGameOver();
  if (state === 'saving' || state === 'qr') renderQR();
  if (isPortrait()) renderRotateHint();
}

function isPortrait() { return IS_TOUCH && H > W * 1.05; }

function renderRotateHint() {
  const u = Math.min(W, H) / 100;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  logo(W / 2, H * 0.16, u * 5, 'center');

  ctx.translate(W / 2, H * 0.44);
  ctx.rotate(-Math.sin(t) * 0.5 - 0.35);
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(2, u * 0.7);
  ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.fillStyle = BRAND;

  text('GRA DZIAŁA W POZIOMIE', W / 2, H * 0.79, { size: u * 2.4, color: MUTED, align: 'center', spacing: 3 });
}

function tick(dt) {
  stateT += dt;

  // zaniki efektow
  player.hitCooldown = Math.max(0, player.hitCooldown - dt);
  player.shake = Math.max(0, player.shake - dt * 45);
  player.flashRed = Math.max(0, player.flashRed - dt * 3);
  player.flashBrand = Math.max(0, player.flashBrand - dt * 3);
  popups.forEach((p) => { p.life -= dt * 1.1; p.y -= dt * 60; });
  popups = popups.filter((p) => p.life > 0);
  if (state === 'play') levelBanner = Math.max(0, levelBanner - dt);

  if (Input.pressed('mute')) Sfx.toggle();

  switch (state) {
    case 'attract':
      updateAttractDemo(dt);
      fetchBoard();
      if (Input.pressed('start') && !isPortrait()) startRun();
      break;

    case 'saving':
      updateAttractDemo(dt * 0.35);
      if (runCode) { state = 'qr'; stateT = 0; Sfx.ui(); }
      else if (runCodeErr || stateT > 5) fallbackToLocal();
      break;

    case 'qr':
      updateAttractDemo(dt * 0.35);
      fetchBoard();   // zeby pokazac, ktore miejsce dalby ten wynik
      // Kod zyje dobe, wiec nie trzymamy przy nim kolejki - 75 s wystarczy,
      // zeby wyciagnac telefon i zeskanowac.
      if (Input.pressed('start') && stateT > 1.2) startRun();
      if (stateT > 75) { state = 'attract'; stateT = 0; player.speed = maxSpeed * 0.4; }
      break;

    case 'countdown':
      updateCars(dt, findSegment(player.position + playerZ), PLAYER_W);
      countdown -= dt;
      const n = Math.ceil(countdown);
      if (n !== lastBeep) {
        lastBeep = n;
        if (n > 0 && n <= 3) Sfx.start3();
        if (n <= 0) Sfx.start1();
      }
      if (countdown <= 0) { state = 'play'; stateT = 0; }
      break;

    case 'play':
      updatePlay(dt);
      break;

    case 'initials': {
      const tap = Input.consumeTap();
      let handledTap = false;
      if (tap && stateT > 0.4) {
        for (const z of touchZones) {
          if (tap.x >= z.x && tap.x <= z.x + z.w && tap.y >= z.y && tap.y <= z.y + z.h) {
            z.act(); handledTap = true; break;
          }
        }
      }
      if (handledTap) break;
      if (Input.pressed('up')) cycleLetter(initialIdx, 1);
      if (Input.pressed('down')) cycleLetter(initialIdx, -1);
      if (Input.pressed('left')) { initialIdx = (initialIdx + 2) % 3; Sfx.ui(); }
      if (Input.pressed('right')) { initialIdx = (initialIdx + 1) % 3; Sfx.ui(); }
      if (Input.pressed('ok') && stateT > 0.4 && !Input.touchUsed) {
        if (initialIdx < 2) { initialIdx++; Sfx.ui(); }
        else submitInitials();
      }
      break;
    }

    case 'gameover':
      updateAttractDemo(dt * 0.35);
      if (Input.pressed('start') && stateT > 0.8) startRun();
      if (stateT > 25 || (Input.idleMs() > 20000 && stateT > 6)) {
        state = 'attract'; stateT = 0;
        player.speed = maxSpeed * 0.4;
      }
      break;
  }
}
let lastBeep = null;

// ---------------------------------------------------------------- start/boot
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}
document.getElementById('fsbtn').addEventListener('click', () => { toggleFullscreen(); Sfx.resume(); });
window.addEventListener('keydown', (e) => { if (e.code === 'KeyF') toggleFullscreen(); });
window.addEventListener('pointerdown', () => Sfx.resume());

if (IS_TOUCH) CFG.drawDistance = 170;   // telefon nie udzwignie pelnego zasiegu

loadScores();
buildTrack();
resize();
resetRun();
player.speed = maxSpeed * 0.4;
Input.init();
requestAnimationFrame(frame);
</script>
