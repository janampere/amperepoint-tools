// ---------------------------------------------------------------- rendering
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, projW = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2);
  W = Math.floor(window.innerWidth);
  H = Math.floor(window.innerHeight);
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // geometria trzymana w proporcji ~16:9, zeby ultrawide nie rozciagalo drogi
  projW = Math.min(W, H * 1.9);
}
window.addEventListener('resize', resize);

function project(p, camX, camY, camZ) {
  p.camera.x = (p.world.x || 0) - camX;
  p.camera.y = (p.world.y || 0) - camY;
  p.camera.z = (p.world.z || 0) - camZ;
  p.screen.scale = cameraDepth / p.camera.z;
  p.screen.x = Math.round((W / 2) + (p.screen.scale * p.camera.x * projW / 2));
  p.screen.y = Math.round((H / 2) - (p.screen.scale * p.camera.y * H / 2));
  p.screen.w = Math.round(p.screen.scale * CFG.roadWidth * projW / 2);
}

function polygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}

function renderSegment(x1, y1, w1, x2, y2, w2, color, promenade) {
  const lanes = CFG.lanes;
  const r1 = w1 / 14, r2 = w2 / 14;
  const l1 = w1 / Math.max(32, 8 * lanes), l2 = w2 / Math.max(32, 8 * lanes);

  ctx.fillStyle = color.grass;
  ctx.fillRect(0, y2, W, y1 - y2);

  if (promenade) {
    // chodnik po obu stronach, od krawedzi do ~1.9 szerokosci jezdni
    const o1 = w1 * 1.9, o2 = w2 * 1.9;
    polygon(x1 - o1, y1, x1 - w1, y1, x2 - w2, y2, x2 - o2, y2, season.walk);
    polygon(x1 + w1, y1, x1 + o1, y1, x2 + o2, y2, x2 + w2, y2, season.walk);
    // kraweznik na zewnatrz chodnika
    const c1 = w1 * 0.03, c2 = w2 * 0.03;
    polygon(x1 - o1 - c1, y1, x1 - o1, y1, x2 - o2, y2, x2 - o2 - c2, y2, season.curb);
    polygon(x1 + o1, y1, x1 + o1 + c1, y1, x2 + o2 + c2, y2, x2 + o2, y2, season.curb);
  }

  polygon(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, color.rumble);
  polygon(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, color.rumble);
  polygon(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, color.road);

  if (color.lane) {
    const lw1 = w1 * 2 / lanes, lw2 = w2 * 2 / lanes;
    let lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
    for (let lane = 1; lane < lanes; lane++) {
      polygon(lx1 - l1 / 2, y1, lx1 + l1 / 2, y1, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2, color.lane);
      lx1 += lw1; lx2 += lw2;
    }
  }
}

function renderSprite(sprite, scale, destX, destY, offsetX, offsetY, clipY, extra) {
  const destW = sprite.w * scale * projW / 2;
  const destH = destW * (sprite.h / sprite.w);
  if (destW < 1 || destH < 1) return;
  const x = destX + destW * (offsetX || 0);
  const y = destY + destH * (offsetY || 0);
  if (x > W + destW || x + destW < -destW) return;

  const clipH = clipY ? Math.max(0, y + destH - clipY) : 0;
  if (clipH >= destH) return;

  ctx.save();
  if (clipH > 0) {
    ctx.beginPath();
    ctx.rect(0, 0, W, y + destH - clipH);
    ctx.clip();
  }
  sprite.draw(ctx, x, y, destW, destH, extra || 0);
  ctx.restore();
}

function renderSky() {
  const horizon = H * 0.5, t = season;
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, t.sky[0]);
  g.addColorStop(0.6, t.sky[1]);
  g.addColorStop(1, t.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizon + H * 0.14);

  if (t.night) renderStars(horizon);
  const seaH = H * 0.03, seaTop = horizon - seaH;
  if (t.sun) drawSun(W * 0.5, H * t.sun.y, H * t.sun.r, t.sun, seaTop);

  // ocean pasem na horyzoncie, z odblaskiem slonca
  ctx.fillStyle = t.sea;
  ctx.fillRect(0, seaTop, W, seaH + 2);
  if (t.sun && t.sun.y > 0.3) {
    ctx.fillStyle = t.sun.c1;
    for (let i = 0; i < 4; i++) {
      const lw = H * t.sun.r * (1.4 - i * 0.3);
      ctx.globalAlpha = 0.55 - i * 0.1;
      ctx.fillRect(W * 0.5 - lw / 2, seaTop + seaH * (0.15 + i * 0.22), lw, Math.max(1, seaH * 0.1));
    }
    ctx.globalAlpha = 1;
  }

  renderSkyline(seaTop + seaH * 0.5, t);

  // linia horyzontu - w nocy neonowa
  ctx.fillStyle = t.night ? 'rgba(255,95,162,0.7)' : 'rgba(18,18,18,0.18)';
  ctx.fillRect(0, horizon, W, t.night ? 2 : 1);
}

// Slonce jak z plakatu synthwave: gradient od zoltego do rozu, dolna polowa
// pocieta poziomymi szczelinami. Chowa sie za oceanem (clip do seaTop).
function drawSun(cx, cy, r, sun, seaTop) {
  ctx.save();
  ctx.beginPath();
  if (sun.stripes) {
    ctx.rect(cx - r, cy - r, r * 2, r);
    for (let i = 0; i < 6; i++) {
      const y0 = cy + r * (i * 0.17);
      ctx.rect(cx - r, y0, r * 2, r * (0.13 - i * 0.012));
    }
  } else {
    ctx.rect(cx - r, cy - r, r * 2, r * 2);
  }
  ctx.clip();
  ctx.beginPath();
  ctx.rect(0, 0, W, seaTop);
  ctx.clip();
  const g = ctx.createLinearGradient(0, cy - r, 0, cy + r);
  g.addColorStop(0, sun.c1);
  g.addColorStop(1, sun.c2);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Panorama nadmorskiego miasta: wiezowce w skupiskach, miedzy nimi widac
// ocean, a na pierwszym planie male palmy. W nocy okna swieca neonem.
function renderSkyline(base, t) {
  const bw = W / 30;
  const off = (skyOffset * 0.9) % (bw * 30);
  for (let i = -2; i <= 62; i++) {
    const k = ((i % 30) + 30) % 30;
    const cluster = Math.sin(k * 0.42 + 0.8);
    if (cluster < -0.15) continue;
    const bx = i * bw - off;
    if (bx > W + bw || bx < -bw * 2) continue;
    const hh = H * (0.02 + 0.075 * Math.abs(Math.sin(k * 2.3 + 1)) * (0.4 + cluster));
    const w0 = bw * 0.72;
    ctx.fillStyle = t.city;
    ctx.fillRect(bx, base - hh, w0, hh);
    // schodkowy szczyt jak w art deco
    if (k % 3 === 0) ctx.fillRect(bx + w0 * 0.25, base - hh - H * 0.012, w0 * 0.5, H * 0.012);
    if (t.night) {
      const neon = k % 2 ? '#FF5FA2' : '#3FE0F0';
      ctx.fillStyle = neon;
      ctx.fillRect(bx, base - hh, w0, Math.max(1, H * 0.002));
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 3; c++) {
          const hsh = Math.abs(Math.sin(k * 91.7 + r * 13.1 + c * 7.3) * 4375.85) % 1;
          if (hsh < 0.55) continue;
          const wy = base - hh + H * 0.006 + r * H * 0.008;
          if (wy > base - H * 0.004) continue;
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = hsh > 0.8 ? neon : '#FFD9A0';
          ctx.fillRect(bx + w0 * (0.15 + c * 0.28), wy, w0 * 0.14, H * 0.003);
        }
      }
      ctx.globalAlpha = 1;
    }
  }
  // male palmy na horyzoncie
  const pw = W / 9;
  const poff = (skyOffset * 1.3) % (pw * 9);
  for (let i = -1; i <= 18; i++) {
    if (Math.sin(i * 1.7) < 0.2) continue;
    const px = i * pw - poff + pw * 0.3;
    if (px < -pw || px > W + pw) continue;
    const ph = H * (0.05 + 0.025 * Math.abs(Math.sin(i * 3.1)));
    drawTree(ctx, px, base - ph + H * 0.004, ph * 0.7, ph);
  }
}

// Gwiazdy w nocy - pozycje z haszowania indeksu, bez stanu miedzy klatkami.
function renderStars(horizon) {
  const t = performance.now() * 0.001;
  ctx.fillStyle = '#FFFFFF';
  for (let i = 0; i < 70; i++) {
    const sx = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
    const sy = Math.abs(Math.sin(i * 78.233) * 12345.678) % 1;
    ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(t * 0.8 + i));
    ctx.fillRect(sx * W, sy * horizon * 0.75, 1.6, 1.6);
  }
  ctx.globalAlpha = 1;
}


let skyOffset = 0;

// Kamera podnosi sie przed zjazdem. Na szczycie gorki droga za grzbietem
// chowala sie pod horyzontem i gracz jechal w ciemno. Patrzymy kawalek do
// przodu: im glebiej droga opada, tym wyzej kamera - plynnie, bez skokow.
let camLift = 0;
function updateCamLift() {
  const base = player.position + playerZ;
  const here = findSegment(base);
  const y0 = lerp(here.p1.world.y, here.p2.world.y, (base % CFG.segmentLength) / CFG.segmentLength);
  let drop = 0;
  for (let k = 8; k <= 48; k += 8) {
    const seg = findSegment(base + k * CFG.segmentLength);
    drop = Math.max(drop, (y0 - seg.p1.world.y) * (1 - k / 80));
  }
  const target = clamp(drop * 0.55, 0, CFG.cameraHeight * 1.3);
  camLift += (target - camLift) * (target > camLift ? 0.07 : 0.035);
}

function render() {
  const baseSegment = findSegment(player.position);
  const basePercent = (player.position % CFG.segmentLength) / CFG.segmentLength;
  const playerSegment = findSegment(player.position + playerZ);
  const playerPercent = ((player.position + playerZ) % CFG.segmentLength) / CFG.segmentLength;
  const playerY = lerp(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);
  const speedPct = player.speed / maxSpeed;
  updateCamLift();
  const camH = CFG.cameraHeight + camLift;

  ctx.save();
  if (player.shake > 0) {
    ctx.translate(rnd(-1, 1) * player.shake, rnd(-1, 1) * player.shake);
  }

  ctx.fillStyle = PAPER;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  renderSky();

  let maxy = H;
  let x = 0;
  let dx = -(baseSegment.curve * basePercent);

  // --- droga ---
  for (let n = 0; n < CFG.drawDistance; n++) {
    const seg = segments[(baseSegment.index + n) % segments.length];
    seg.looped = seg.index < baseSegment.index;
    seg.fog = fogAt(n / CFG.drawDistance, CFG.fogDensity);
    seg.clip = maxy;

    const camZ = player.position - (seg.looped ? trackLength : 0);
    project(seg.p1, (player.x * CFG.roadWidth) - x, playerY + camH, camZ);
    project(seg.p2, (player.x * CFG.roadWidth) - x - dx, playerY + camH, camZ);

    x += dx;
    dx += seg.curve;

    if (seg.p1.camera.z <= cameraDepth || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;

    renderSegment(seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w,
                  seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w, seg.color, seg.promenade);

    if (seg.fog < 1) {
      ctx.globalAlpha = 1 - seg.fog;
      ctx.fillStyle = season.fog;
      ctx.fillRect(0, seg.p2.screen.y, W, seg.p1.screen.y - seg.p2.screen.y);
      ctx.globalAlpha = 1;
    }
    maxy = seg.p2.screen.y;
  }

  // --- sprite'y i auta: od tylu do przodu ---
  const now = performance.now();
  for (let n = CFG.drawDistance - 1; n > 0; n--) {
    const seg = segments[(baseSegment.index + n) % segments.length];
    if (!seg.p1.screen.scale || seg.p1.camera.z <= cameraDepth) continue;

    if (seg.promenade) drawPromenadeRail(seg);
    for (const m of seg.life) {
      const pct = ((m.z % CFG.segmentLength) / CFG.segmentLength);
      const scale = lerp(seg.p1.screen.scale, seg.p2.screen.scale, pct);
      const sx = lerp(seg.p1.screen.x, seg.p2.screen.x, pct);
      const sy = lerp(seg.p1.screen.y, seg.p2.screen.y, pct);
      const sw = lerp(seg.p1.screen.w, seg.p2.screen.w, pct);
      renderSprite(m.sprite, scale, sx + sw * m.offset, sy, -0.5, -1, seg.clip, now);
    }

    for (const car of seg.cars) {
      const pct = ((car.z % CFG.segmentLength) / CFG.segmentLength);
      const scale = lerp(seg.p1.screen.scale, seg.p2.screen.scale, pct);
      const sx = lerp(seg.p1.screen.x, seg.p2.screen.x, pct);
      const sy = lerp(seg.p1.screen.y, seg.p2.screen.y, pct);
      const sw = lerp(seg.p1.screen.w, seg.p2.screen.w, pct);
      const sprite = { w: car.w, h: car.w * 0.92, draw: (c, x0, y0, w0, h0) => drawCar(c, x0, y0, w0, h0, car.skin) };
      renderSprite(sprite, scale, sx + sw * car.offset, sy, -0.5, -1, seg.clip);
    }

    for (const sp of seg.sprites) {
      if (sp.minLevel && player.level < sp.minLevel) continue;
      if (sp.kind === 'pickup' && now - sp.takenAt < 9000) continue;
      renderSprite(sp.sprite, seg.p1.screen.scale,
                   seg.p1.screen.x + seg.p1.screen.w * sp.offset,
                   seg.p1.screen.y, -0.5, -1, seg.clip, now);
    }
  }

  // --- gracz ---
  // Auto gracza ma staly rozmiar ekranowy (jak w klasycznych arcade'ach),
  // nie skaluje sie rzutem perspektywicznym - inaczej zaslania pol ekranu.
  const pScale = cameraDepth / playerZ;
  const pDestY = (H / 2) - (pScale * lerp(playerSegment.p1.camera.y, playerSegment.p2.camera.y, playerPercent) * H / 2);
  const bounce = speedPct > 0.02 ? (1.4 * Math.random() * speedPct) * pick([-1, 1]) : 0;
  const lean = state === 'play' ? player.roll : Input.steer * speedPct;
  const blink = player.hitCooldown > 0 && Math.floor(player.hitCooldown * 16) % 2 === 0;
  if ((state === 'play' || state === 'countdown') && !blink) {
    const omoda = player.level >= OMODA_LEVEL;
    const cw = projW * (omoda ? 0.215 : 0.195);
    const ch = cw * (omoda ? 1.0 : 0.94);
    const cx = W / 2 - cw / 2;
    const cy = Math.min(pDestY + bounce, H * 0.985) - ch;   // nie wychodz poza dolna krawedz
    ctx.save();
    ctx.translate(W / 2, cy + ch);
    ctx.rotate(-lean * 0.05);
    // SUV dodatkowo przesuwa sie bokiem na zawieszeniu
    ctx.translate(-W / 2 + (omoda ? -lean * cw * 0.04 : 0), -(cy + ch));
    if (omoda) drawOmoda(ctx, cx, cy, cw, ch, OMODA_SKIN, { boost: speedPct > 0.75 });
    else drawCar(ctx, cx, cy, cw, ch, PLAYER_SKIN, { boost: speedPct > 0.75 });
    ctx.restore();
  }

  ctx.restore();

  // --- bliski flash na zderzeniu / ladowaniu ---
  if (player.flashRed > 0) {
    ctx.fillStyle = 'rgba(220,40,40,' + (player.flashRed * 0.45).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (player.turbo > 0 && state === 'play') {
    // smugi predkosci od srodka do krawedzi
    const t = performance.now() * 0.004;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 18; i++) {
      const a = i * 2.39996 + t;
      const r0 = Math.min(W, H) * (0.32 + ((t * 3 + i * 0.37) % 1) * 0.3);
      const r1 = r0 + Math.min(W, H) * 0.12;
      ctx.beginPath();
      ctx.moveTo(W / 2 + Math.cos(a) * r0, H * 0.55 + Math.sin(a) * r0 * 0.6);
      ctx.lineTo(W / 2 + Math.cos(a) * r1, H * 0.55 + Math.sin(a) * r1 * 0.6);
      ctx.stroke();
    }
  }
  if (player.flashBrand > 0) {
    ctx.fillStyle = 'rgba(255,107,0,' + (player.flashBrand * 0.30).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

// -------------------------------------------------------------------- HUD/UI
function setFont(size, weight, mono) {
  ctx.font = (weight || 600) + ' ' + Math.round(size) + 'px ' +
    (mono ? '"Geist Mono", "SF Mono", Consolas, monospace' : '"Geist", "Segoe UI", Arial, sans-serif');
}

function text(str, x, y, opts) {
  opts = opts || {};
  setFont(opts.size || 20, opts.weight, opts.mono);
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'alphabetic';
  if (opts.spacing !== undefined && 'letterSpacing' in ctx) ctx.letterSpacing = opts.spacing + 'px';
  if (opts.shadow) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(str, x + (opts.shadow), y + (opts.shadow));
  }
  ctx.fillStyle = opts.color || '#fff';
  ctx.fillText(str, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

// Biala wersja logo (znak + napis) na ekran tytulowy - na niebie o zachodzie
// rysujemy ja bez plytki. Robiona raz z tego samego PNG: przezroczystosc
// zostaje, kolor zamieniamy na bialy.
let logoWhite = null;
function logoWhiteCanvas() {
  if (logoWhite || !logoReady || !logoImg.naturalWidth) return logoWhite;
  const c = document.createElement('canvas');
  c.width = logoImg.naturalWidth;
  c.height = logoImg.naturalHeight;
  const cx = c.getContext('2d');
  cx.drawImage(logoImg, 0, 0);
  cx.globalCompositeOperation = 'source-in';
  cx.fillStyle = '#FFFFFF';
  cx.fillRect(0, 0, c.width, c.height);
  logoWhite = c;
  return c;
}
function logoWhiteAt(x, y, h) {
  const c = logoWhiteCanvas();
  if (!c) {
    text('AMPERE POINT', x, y + h * 0.35, { size: h * 0.8, color: PAPER, align: 'center', weight: 700 });
    return;
  }
  const w = h * c.width / c.height;
  ctx.drawImage(c, x - w / 2, y - h / 2, w, h);
}

function logo(x, y, h, align) {
  const ar = (logoReady && logoImg.naturalWidth) ? logoImg.naturalWidth / logoImg.naturalHeight : 4.05;
  const w = h * ar;
  drawLogoInto(ctx, align === 'center' ? x - w / 2 : x, y - h / 2, w, h);
}

function batteryBar(x, y, w, h, pct) {
  const p = clamp(pct / 100, 0, 1);
  const low = pct < 25;
  const pulse = low ? 0.4 + 0.6 * Math.abs(Math.sin(performance.now() * 0.008)) : 1;
  ctx.fillStyle = GREY;
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = low ? '#D93025' : BRAND;
  if (p > 0.001) ctx.fillRect(x, y, Math.max(3, w * p), h);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  // podzialka co 25%
  ctx.fillStyle = 'rgba(18,18,18,0.25)';
  for (let i = 1; i < 4; i++) ctx.fillRect(x + (w / 4) * i, y, 1, h);
}

function renderHUD() {
  const pad = Math.round(Math.min(W, H) * 0.028);
  const u = Math.min(W, H) / 100;   // jednostka skalowania UI

  // panel gorny: biel, kreska, zero zaokraglen
  const barH = u * 12;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = INK;
  ctx.fillRect(0, barH, W, 1);

  logo(pad, u * 4.2, u * 3);
  batteryBar(pad, u * 7.4, u * 26, u * 2.6, player.battery);
  text('BATERIA ' + Math.ceil(player.battery) + '%', pad + u * 27.5, u * 9.5,
       { size: u * 1.9, color: player.battery < 25 ? '#D93025' : MUTED, mono: true, weight: 600 });

  // okrazenie
  const lvW = u * 15, lvX = pad + u * 46;
  ctx.fillStyle = INK;
  ctx.fillRect(lvX, u * 2.4, lvW, u * 7.4);
  text('OKRĄŻENIE', lvX + lvW / 2, u * 5, { size: u * 1.4, color: '#9AA3B2', align: 'center', spacing: 2 });
  text(player.level + '/' + RACE.laps, lvX + lvW / 2, u * 8.6,
       { size: u * 3.6, color: PAPER, align: 'center', mono: true, weight: 700 });

  // turbo / tryb awaryjny - stan, ktory zmienia jazde, musi byc widac
  const liX = lvX + lvW + u * 2.5;
  if (player.turbo > 0) {
    const tw = u * 20;
    ctx.fillStyle = BRAND;
    ctx.fillRect(liX, u * 2.4, tw, u * 7.4);
    text('TURBO', liX + tw / 2, u * 6.4, { size: u * 2.8, color: PAPER, align: 'center', spacing: 4, weight: 900 });
    ctx.fillStyle = PAPER;
    ctx.fillRect(liX + u, u * 7.8, (tw - u * 2) * clamp(player.turbo / TURBO.max, 0, 1), u * 0.9);
  } else if (player.limp) {
    text('TRYB AWARYJNY', liX, u * 5.4, { size: u * 1.8, color: '#D93025', spacing: 2, weight: 700 });
    text('ŁAP ŁADOWARKĘ', liX, u * 8.2, { size: u * 1.4, color: MUTED, spacing: 2 });
  } else if (player.bestLap) {
    text('NAJLEPSZE OKR.', liX, u * 4.4, { size: u * 1.4, color: MUTED, spacing: 2 });
    text(fmtTime(player.bestLap * 1000), liX, u * 8.6, { size: u * 2.8, color: INK, mono: true, weight: 700 });
  }

  // wynik
  text('CZAS', W - pad, u * 3.6, { size: u * 1.6, color: MUTED, align: 'right', spacing: 2.5 });
  text(fmtTime(player.raceT * 1000), W - pad, u * 9.6,
       { size: u * 5.2, color: INK, align: 'right', mono: true, weight: 700 });

  // mnoznik
  if (player.streak > 1) {
    text('SERIA ŁADOWAREK ' + player.streak, W / 2, barH + u * 3, { size: u * 1.6, color: season.ink, align: 'center', spacing: 2 });
  }

  // Predkosc i dystans na bialych plytkach - jezdnia jest ciemna,
  // sam tekst gubilby sie na niej.
  const kmh = Math.round((player.speed / maxSpeed) * CFG.topSpeedKmh);
  const spW = u * 22, spH = u * 11;
  ctx.fillStyle = PAPER;
  ctx.fillRect(W - pad - spW, H - pad - spH, spW, spH);
  ctx.fillStyle = BRAND;
  ctx.fillRect(W - pad - spW, H - pad - spH, spW, u * 0.5);
  text(String(kmh), W - pad - u * 1.2, H - pad - u * 3.4,
       { size: u * 7, color: INK, align: 'right', mono: true, weight: 700 });
  text('km/h', W - pad - u * 1.2, H - pad - u * 1.2,
       { size: u * 1.8, color: MUTED, align: 'right', spacing: 1 });

  const dsW = u * 18, dsH = u * 5.4;
  ctx.fillStyle = PAPER;
  ctx.fillRect(pad, H - pad - dsH, dsW, dsH);
  text('DYSTANS', pad + u * 1.2, H - pad - dsH + u * 2, { size: u * 1.4, color: MUTED, spacing: 2 });
  text(Math.floor(player.travelled / CFG.distDivisor) + ' m', pad + u * 1.2, H - pad - u * 1.2,
       { size: u * 2.6, color: INK, mono: true, weight: 700 });

  // popupy punktowe - plytka w kolorze zdarzenia, tekst wyciety na bialo
  popups.forEach((p) => {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    const fs = u * (p.big ? 3.4 : 2.6);
    setFont(fs, 700, true);
    const tw = ctx.measureText(p.txt).width;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - tw / 2 - u * 1.2, p.y - fs, tw + u * 2.4, fs * 1.45);
    text(p.txt, p.x, p.y + fs * 0.1, { size: fs, color: PAPER, align: 'center', mono: true, weight: 700 });
    ctx.globalAlpha = 1;
  });

  // strefy dotyku - widoczne mocno na starcie, potem ledwo
  if (Input.touchUsed) {
    const fade = state === 'play' ? clamp(1 - (stateT - 4) / 3, 0.12, 1) : 1;
    ctx.globalAlpha = fade * 0.65;
    ['◀', '▶'].forEach((g, i) => {
      const x = i ? W * 0.88 : W * 0.12;
      const active = i ? Input.steer > 0.3 : Input.steer < -0.3;
      const s = u * 12;
      ctx.fillStyle = active ? BRAND : PAPER;
      ctx.fillRect(x - s / 2, H * 0.62 - s / 2, s, s);
      text(g, x, H * 0.62 + u * 2.2, { size: u * 6, color: active ? PAPER : INK, align: 'center' });
    });
    ctx.globalAlpha = 1;
  }

  // baner awansu
  if (levelBanner > 0) {
    const reward = player.level === OMODA_LEVEL;
    const withPhoto = reward && imgOmoda.ready;
    const p = clamp(levelBanner / (reward ? 4 : 2.4), 0, 1);
    const slide = (1 - Math.min(1, ((reward ? 4 : 2.4) - levelBanner) * 4)) * u * 8;
    ctx.globalAlpha = Math.min(1, p * 2.5);

    if (reward) {
      // Omoda bez paska na caly ekran: wyciete auto z pomaranczowa poswiata,
      // mruga i nie zaslania drogi przed autem gracza.
      const blink = 0.55 + 0.45 * Math.abs(Math.sin(performance.now() * 0.009));
      const cx = W / 2, cy = H * 0.27 + slide;
      const ph = u * 14;
      if (withPhoto) {
        const pw = ph * (imgOmoda.img.naturalWidth / imgOmoda.img.naturalHeight);
        const g = ctx.createRadialGradient(cx, cy, ph * 0.15, cx, cy, pw * 0.75);
        g.addColorStop(0, 'rgba(255,106,0,' + (0.75 * blink) + ')');
        g.addColorStop(0.5, 'rgba(255,79,31,' + (0.35 * blink) + ')');
        g.addColorStop(1, 'rgba(255,79,31,0)');
        ctx.fillStyle = g;
        ctx.fillRect(cx - pw, cy - ph, pw * 2, ph * 2);
        ctx.drawImage(imgOmoda.img, cx - pw / 2, cy - ph / 2, pw, ph);
      }
      const ty = cy - ph / 2 - u * 1.6;
      setFont(u * 4.4, 900);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.lineJoin = 'round';
      ctx.lineWidth = u * 0.9;
      ctx.strokeStyle = INK;
      ctx.strokeText('OMODA 5 ODBLOKOWANA', cx, ty);
      ctx.fillStyle = blink > 0.75 ? BRAND : PAPER;
      ctx.fillText('OMODA 5 ODBLOKOWANA', cx, ty);
      ctx.lineJoin = 'miter';
      const sy = cy + ph / 2 + u * 3.2;
      setFont(u * 1.9, 700);
      ctx.lineWidth = u * 0.6;
      ctx.strokeText('NOWA FURA · OSTATNIE OKRĄŻENIE', cx, sy);
      ctx.fillStyle = PAPER;
      ctx.fillText('NOWA FURA · OSTATNIE OKRĄŻENIE', cx, sy);
    } else {
      const bh = u * 16, by = H * 0.30 + slide;
      ctx.fillStyle = INK;
      ctx.fillRect(0, by, W, bh);
      ctx.fillStyle = BRAND;
      ctx.fillRect(0, by + bh - u * 1.2, W, u * 1.2);
      text('OKRĄŻENIE ' + player.level + '/' + RACE.laps, W / 2, by + u * 8,
           { size: u * 8, color: PAPER, align: 'center', spacing: 6, weight: 900 });
      text(season.name + ' · POPRZEDNIE OKR. ' + fmtTime(player.lastLap * 1000),
           W / 2, by + u * 12.6, { size: u * 2, color: BRAND, align: 'center', spacing: 3 });
    }
    ctx.globalAlpha = 1;
  }

  // ostrzezenie o baterii
  if (player.battery < 20 && Math.floor(performance.now() / 350) % 2 === 0) {
    const msg = 'NISKA BATERIA — ŁAP ŁADOWARKI';
    setFont(u * 2.8, 700);
    const tw = ctx.measureText(msg).width + u * 5;
    ctx.fillStyle = '#D93025';
    ctx.fillRect(W / 2 - tw / 2, H * 0.76, tw, u * 5.4);
    text(msg, W / 2, H * 0.76 + u * 3.6, { size: u * 2.8, color: PAPER, align: 'center', spacing: 2, weight: 700 });
  }
}

function padGlyph(x, y, r, label) {
  ctx.fillStyle = GREY;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.strokeStyle = INK; ctx.lineWidth = 1;
  ctx.strokeRect(x - r + 0.5, y - r + 0.5, r * 2 - 1, r * 2 - 1);
  text(label, x, y + r * 0.36, { size: r * 0.95, color: INK, align: 'center', weight: 700 });
}

function renderControlsHint(cx, cy, u) {
  const items = IS_TOUCH ? [
    { g: '◀', t: 'DOTKNIJ LEWEJ STRONY' },
    { g: '▮', t: 'ŚRODEK — HAMULEC' },
    { g: '▶', t: 'DOTKNIJ PRAWEJ STRONY' }
  ] : [
    { g: '↔', t: 'LEWY DRĄŻEK — SKRĘT' },
    { g: 'RT', t: 'GAZ  ·  LT — HAMULEC' },
    { g: 'A', t: 'START / POTWIERDŹ' }
  ];
  // Odstep liczony z szerokosci najdluzszego podpisu, bo przy waskim oknie
  // staly rozstaw sklejal je w jeden ciag.
  const SPACING = 1.5;
  let fs = u * 1.5;
  setFont(fs, 600);
  // measureText nie uwzglednia rozstrzelenia liter, a przy 20 znakach
  // dokłada ono wiecej niz caly margines - stad doliczamy je recznie.
  const longest = Math.max(...items.map(
    (it) => ctx.measureText(it.t).width + SPACING * it.t.length)) + u * 4;
  let gap = Math.max(u * 24, longest);
  const total = gap * 2 + longest;
  if (total > W * 0.95) {
    const k = (W * 0.95) / total;
    gap *= k; fs *= k;
  }
  items.forEach((it, i) => {
    const x = cx + (i - 1) * gap;
    padGlyph(x, cy, u * 3, it.g);
    text(it.t, x, cy + u * 6, { size: fs, color: MUTED, align: 'center', spacing: SPACING });
  });
}

// Nagroda stoi w tym samym wierszu co wynik - dopiero razem mowia, co sie
// komu nalezy. Puste miejsca tez pokazuja nagrode, zeby rano, przy pustej
// tablicy, bylo widac o co gra sie toczy.
const PLACES = 7;
// Po jednym wierszu na miejsce, zeby rzedy obu tabel sie pokrywaly.
const PRIZES = [
  'GTA VI',
  'Ładowarka B35',
  'Ładowarka B35',
  'Dr. Storm',
  'Dr. Storm',
  'Dr. Storm',
  'Dr. Storm'
];
const ROW_H = (u) => u * 3.4;

function panelFrame(x, top, w, u, rows) {
  ctx.strokeStyle = INK; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, top + u * 2 + 0.5, w - 1, ROW_H(u) * rows - 1);
}

function renderLeaderboard(cx, top, u) {
  const rows = boardRows();
  const w = u * 46, x = cx - w / 2, rowH = ROW_H(u);
  text('NAJLEPSZE CZASY', cx, top, { size: u * 1.6, color: MUTED, align: 'center', spacing: 3 });

  for (let i = 0; i < PLACES; i++) {
    const s = rows[i];
    const ry = top + u * 2 + i * rowH;
    const first = i === 0;
    if (first) { ctx.fillStyle = BRAND; ctx.fillRect(x, ry, w, rowH); }
    else if (i % 2 === 0) { ctx.fillStyle = GREY; ctx.fillRect(x, ry, w, rowH); }

    const col = first ? PAPER : INK;
    const dim = first ? 'rgba(255,255,255,0.8)' : MUTED;
    const y = ry + rowH * 0.72;

    text(String(i + 1), x + u * 1.6, y, { size: u * 1.9, color: dim, mono: true });
    if (s) {
      text(s.name, x + u * 5.5, y, { size: u * 2.1, color: col, mono: true, spacing: 2, weight: 700 });
      text(fmtTime(s.score), x + w - u * 1.6, y,
           { size: u * 2.1, color: col, mono: true, align: 'right', weight: 600 });
    } else {
      text('wolne miejsce', x + u * 5.5, y, { size: u * 1.8, color: dim });
    }
  }
  panelFrame(x, top, w, u, PLACES);
}

function renderPrizes(cx, top, u) {
  const w = u * 38, x = cx - w / 2, rowH = ROW_H(u);
  text('NAGRODY', cx, top, { size: u * 1.6, color: MUTED, align: 'center', spacing: 3 });
  PRIZES.forEach((what, i) => {
    const ry = top + u * 2 + i * rowH;
    const first = i === 0;
    if (first) { ctx.fillStyle = BRAND; ctx.fillRect(x, ry, w, rowH); }
    else if (i % 2 === 0) { ctx.fillStyle = GREY; ctx.fillRect(x, ry, w, rowH); }
    const y = ry + rowH * 0.72;
    text(String(i + 1), x + u * 1.6, y,
         { size: u * 1.9, color: first ? 'rgba(255,255,255,0.8)' : MUTED, mono: true });
    text(what, x + u * 6, y, { size: u * 1.9, color: first ? PAPER : INK, weight: 600 });
  });
  panelFrame(x, top, w, u, PRIZES.length);
}

// Plansza nagrod: duze haslo i zdjecia produktow. Ekran tytulowy przez

// nie mowi, zdjecie ladowarki i slowo "wygraj" mowi wszystko.
const PRIZE_CARDS = [
  { pos: '1. MIEJSCE', name: 'GTA VI', img: () => imgGta, fallback: gtaIcon, contain: true },
  { pos: '2-3. MIEJSCE', name: 'Ładowarka B35', img: () => imgSeriaB, fallback: primeIcon },

// zostaje jako zapas, gdyby zdjecie sie nie wczytalo.
const imgGta = loadImg('gta6.jpg');
function gtaIcon(ctx, x, y, w, h) {
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, '#FF5FA2'); g.addColorStop(0.55, '#F78C3B'); g.addColorStop(1, '#5B2A86');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '900 ' + (h * 0.30) + 'px Inter, Arial, sans-serif';
  ctx.fillText('GTA', x + w / 2, y + h * 0.50);
  ctx.font = '900 ' + (h * 0.34) + 'px Inter, Arial, sans-serif';
  ctx.fillText('VI', x + w / 2, y + h * 0.86);
  ctx.textAlign = 'left';
}

// Trzecia kolumna: zdjecia nagrod jedno pod drugim. Zdjecie produktu mowi
// przechodzacemu wiecej niz nazwa w tabeli.
function renderPrizePhotos(x, top, u) {
  const cw = u * 30, chh = u * 8, gap = u * 1.4;
  text('CO MOŻNA WYGRAĆ', x + cw / 2, top, { size: u * 1.6, color: MUTED, align: 'center', spacing: 3 });

  PRIZE_CARDS.forEach((card, i) => {
    const y = top + u * 2 + i * (chh + gap);
    ctx.fillStyle = PAPER;
    ctx.fillRect(x, y, cw, chh);
    ctx.strokeStyle = i === 0 ? BRAND : INK;
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y + 1.5, cw - 3, chh - 3);

    const pad = u * 0.7, side = chh - pad * 2;
    const ref = card.img();
    ctx.save();
    ctx.beginPath(); ctx.rect(x + pad, y + pad, side, side); ctx.clip();
    if (ref.ready) {
      const ar = ref.img.naturalWidth / ref.img.naturalHeight;
      let dw = side, dh = side / ar;
      if (card.contain) {   // pudelko gry w calosci, okladka w calosci
        if (dh > side) { dh = side; dw = side * ar; }
        ctx.fillStyle = PAPER;
        ctx.fillRect(x + pad, y + pad, side, side);
      } else if (dh < side) { dh = side; dw = side * ar; }   // wypelnij kwadrat
      ctx.drawImage(ref.img, x + pad + (side - dw) / 2, y + pad + (side - dh) / 2, dw, dh);
    } else {
      ctx.fillStyle = GREY;
      ctx.fillRect(x + pad, y + pad, side, side);
      card.fallback(ctx, x + pad, y + pad, side, side);
    }
    ctx.restore();

    const tx = x + pad * 2 + side;
    text(card.pos, tx, y + chh * 0.42,
         { size: u * 1.5, color: i === 0 ? BRAND : MUTED, spacing: 2 });
    text(card.name, tx, y + chh * 0.78, { size: u * 2.2, color: INK, weight: 700 });
  });
}

function addPopup(txt, color, big) {
  popups.push({ txt, color, big, x: W / 2 + rnd(-40, 40), y: H * 0.56, life: 1.2 });
}

// Bez zyc: kara za zderzenie to stracony czas - auto prawie staje, a turbo
// i seria ladowarek przepadaja.
function hitSomething(penalty, msg) {
  if (player.hitCooldown > 0) return;
  player.speed = Math.max(player.speed * 0.35, 0);
  player.battery = Math.max(0, player.battery - penalty);
  player.streak = 0;
  player.turbo = 0;
  player.hitCooldown = 1.1;
  player.shake = 16;
  player.flashRed = 1;
  player.rollV += (Math.random() < 0.5 ? -1 : 1) * 9;   // uderzenie rozbujuje nadwozie
  Sfx.crash();
  if (msg) addPopup(msg, '#D93025', true);
}

// Przejazd przez linie mety okrazenia.
// overshoot = ulamek ostatniego kroku symulacji, ktory wypadl juz za linia.
// Odejmujemy go, zeby czas nie skakal co 1/60 s - inaczej remisy przy
// kilkuset graczach bylyby realne.
function lapDone(overshoot) {
  player.raceT -= overshoot;
  player.lapT -= overshoot;
  const lap = player.lapT;
  player.lastLap = lap;
  player.bestLap = player.bestLap ? Math.min(player.bestLap, lap) : lap;
  player.lapT = overshoot;
  if (player.level >= RACE.laps) { endRun('finish'); return; }
  levelUp();
}

function levelUp() {
  player.level++;
  applySeason(player.level);
  Music.setLap(player.level);
  levelBanner = player.level === OMODA_LEVEL ? 4 : 2.4;

  // dokladamy ruchu, ale nie przestawiamy aut juz na trasie
  const target = Math.min(LEVEL.carsMax, 14 + (player.level - 1) * LEVEL.carsStep);
  while (cars.length < target) {
    const car = {
      offset: rnd(-0.75, 0.75),
      z: Math.floor(Math.random() * segments.length) * CFG.segmentLength,
      speed: rnd(maxSpeed / 5, maxSpeed / 2.1),
      skin: pick(CAR_SKINS),
      w: TRAFFIC_W
    };
    cars.push(car);
    findSegment(car.z).cars.push(car);
  }
  Sfx.levelUp();
}

function collectPylon(sp) {
  sp.takenAt = performance.now();
  player.streak++;
  player.pickups++;
  player.battery = Math.min(100, player.battery + 22);
  player.limp = false;
  player.turbo = Math.min(TURBO.max, TURBO.base + TURBO.perStreak * (player.streak - 1));
  player.flashBrand = 0.9;
  // Nazwa produktu w popupie - gracz przy okazji zapamietuje, co zbiera.
  const name = sp.sprite === SPR.prime ? 'PRIME' : 'Q11';
  addPopup(name + ' · TURBO', BRAND, player.streak > 1);
  Sfx.pickup(player.streak);
}

function updatePlay(dt) {
  const playerSegment = findSegment(player.position + playerZ);
  const speedPct = player.speed / maxSpeed;
  const dx = dt * 2.6 * speedPct;

  // skret + sila odsrodkowa
  player.x += Input.steer * dx;
  player.x -= dx * Math.min(speedPct, 1) * playerSegment.curve * CFG.centrifugal;

  // zegar wyscigu
  player.raceT += dt;
  player.lapT += dt;
  if (player.raceT >= RACE.maxSec) { endRun('timeout'); return; }

  // limit predkosci: turbo podnosi go ponad normalny, pusta bateria dusi
  let cap = speedCap();
  if (player.limp) cap *= LIMP;
  if (player.turbo > 0) {
    player.turbo = Math.max(0, player.turbo - dt);
    cap *= TURBO.mult;
  }

  // gaz / hamulec; turbo pcha auto samo, nawet bez gazu
  if (player.turbo > 0 && Input.brake <= 0.05) {
    player.speed = accelToward(player.speed, cap, accelRate * TURBO.push, dt);
  } else if (player.speed > cap) {
    // po turbo auto zwalnia lagodnie, bez szarpniecia
    player.speed = Math.max(cap, player.speed + decelRate * TURBO.fade * dt);
  } else if (Input.accel > 0.05) {
    player.speed = accelToward(player.speed, cap * Input.accel, accelRate, dt);
  } else if (Input.brake > 0.05) {
    player.speed = Math.max(0, player.speed + brakeRate * dt * Input.brake);
  } else {
    player.speed = Math.max(0, player.speed + decelRate * dt);
  }

  // pobocze
  const offRoad = Math.abs(player.x) > 1;
  if (offRoad) {
    if (player.speed > offRoadLimit) player.speed = Math.max(offRoadLimit, player.speed + offRoadDecel * dt);
    player.shake = Math.max(player.shake, 4 * speedPct);
    player.battery = Math.max(0, player.battery - 4 * dt);
  }
  player.x = clamp(player.x, -2.6, 2.6);

  // Przechyl nadwozia: sprezyna z tlumieniem. Nasze auto jest sztywne,
  // Omoda to wysoki SUV na miekkim zawieszeniu - przechyla sie mocniej
  // i buja, zanim sie uspokoi.
  const soft = player.level >= OMODA_LEVEL;
  const rollTarget = (Input.steer * 0.7 + playerSegment.curve * 0.12) * Math.min(speedPct, 1.2) * (soft ? 2.4 : 1);
  const k = soft ? 26 : 70, damp = soft ? 2.6 : 16;
  player.rollV += ((rollTarget - player.roll) * k - player.rollV * damp) * dt;
  player.roll += player.rollV * dt;

  // Barierka promenady trzyma auto na jezdni - piesi sa bezpieczni, a kto
  // sie o nia otrze, traci predkosc.
  if (playerSegment.promenade && Math.abs(player.x) > 1.05) {
    const side = Math.sign(player.x);
    player.x = side * 1.0;
    if (player.hitCooldown <= 0) {
      player.speed *= 0.6;
      player.turbo = 0;
      player.shake = 10;
      player.hitCooldown = 0.6;
      Sfx.crash();
      addPopup('BARIERKA', '#D93025', false);
    }
  }

  // kolizje z autami
  if (player.hitCooldown <= 0) {
    for (const car of playerSegment.cars) {
      if (player.speed > car.speed &&
          overlap(player.x, PLAYER_W / CFG.roadWidth, car.offset, car.w / CFG.roadWidth, 0.85)) {
        hitSomething(8, 'STŁUCZKA');
        player.position = (findSegment(player.position + playerZ).p1.world.z - playerZ + trackLength) % trackLength;
        break;
      }
    }
  }

  // sprite'y na jezdni
  const now = performance.now();
  for (const sp of playerSegment.sprites) {
    if (sp.minLevel && player.level < sp.minLevel) continue;
    const halfW = sp.sprite.w / CFG.roadWidth;
    if (!overlap(player.x, PLAYER_W / CFG.roadWidth, sp.offset, halfW, 1.0)) continue;
    if (sp.kind === 'pickup') {
      if (now - sp.takenAt > 9000) collectPylon(sp);
    } else if (sp.kind === 'cone' && player.hitCooldown <= 0) {
      hitSomething(6, 'PACHOŁEK!');
    }
  }

  // ruch do przodu; przewiniecie sie trasy = koniec okrazenia
  const ds = dt * player.speed;
  const before = player.position;
  player.position = (player.position + ds) % trackLength;
  if (player.position < before) {
    lapDone(ds > 0 ? dt * (player.position / ds) : 0);
    if (state !== 'play') return;
  }
  player.travelled += ds;
  skyOffset += (playerSegment.curve * speedPct * dt * 220) + speedPct * dt * 4;

  // bateria: jazda kosztuje prad
  player.battery -= (0.8 + 2.7 * speedPct) * drainScale() * DRAIN * dt;

  updateCars(dt, playerSegment, PLAYER_W);
  updateMovers(dt);
  Sfx.engineUpdate(speedPct, offRoad);

  // Pusta bateria nie konczy gry - auto wlecze sie w trybie awaryjnym, az
  // gracz zlapie ladowarke. Traci czas, nie przejazd.
  if (player.battery <= 0) {
    player.battery = 0;
    if (!player.limp) {
      player.limp = true;
      player.turbo = 0;
      addPopup('TRYB AWARYJNY', '#D93025', true);
    }
  }
}

function updateAttractDemo(dt) {
  // auto jedzie samo w tle ekranu tytulowego
  const seg = findSegment(player.position + playerZ);
  const speedPct = player.speed / maxSpeed;
  player.speed = accelToward(player.speed, maxSpeed * 0.55, accelRate * 0.5, dt);
  const targetX = clamp(-seg.curve * 0.25, -0.7, 0.7);
  player.x = lerp(player.x, targetX, dt * 1.6);
  const ds = dt * player.speed;
  player.position = (player.position + ds) % trackLength;
  skyOffset += (seg.curve * speedPct * dt * 220) + speedPct * dt * 4;
  updateCars(dt, seg, PLAYER_W);
  updateMovers(dt);
}

function endRun(reason) {
  player.endReason = reason || 'finish';
  Music.stop(2.5);
  Sfx.engineUpdate(0, false);
  document.body.classList.remove('playing');
  stateT = 0;
  // Bez mety nie ma czasu, wiec nie ma czego zapisac na tablicy.
  if (player.endReason === 'timeout') {
    Sfx.gameover();
    pendingRank = -1;
    state = 'gameover';
    return;
  }
  Sfx.levelUp();
  player.score = Math.round(player.raceT * 1000);   // ms
  pendingRank = rankFor(player.score);
  state = 'saving';
  requestRunCode();
}

// Kod sie nie wyrobil - wracamy do trybu lokalnego z inicjalami na padzie.
function fallbackToLocal() {
  if (pendingRank >= 0) {
    state = 'initials';
    initials = ['A', 'A', 'A'];
    initialIdx = 0;
  } else {
    state = 'gameover';
  }
  stateT = 0;
}

function startRun() {
  Sfx.resume();
  resetRun();
  Music.start();
  state = 'countdown';
  countdown = 3.99;
  stateT = 0;
  pendingRank = -1;
  document.body.classList.add('playing');
}

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-';
function cycleLetter(idx, dir) {
  const cur = ALPHABET.indexOf(initials[idx]);
  const next = (cur + dir + ALPHABET.length) % ALPHABET.length;
  initials[idx] = ALPHABET[next];
  Sfx.ui();
}

function submitInitials() {
  scores.push({ name: initials.join(''), score: Math.floor(player.score) });
  scores = scores.sort((a, b) => a.score - b.score).slice(0, 10);
  saveScores();
  Sfx.start1();
  state = 'gameover';
  stateT = 0;
}

// ---------------------------------------------------------------- petla gry
let last = performance.now();
let acc = 0;
const STEP = 1 / 60;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;   // po przelaczeniu zakladki nie teleportujemy auta
  acc += dt;

  Input.poll();

  while (acc >= STEP) {
    tick(STEP);
    acc -= STEP;
  }

  if (state === 'attract' && season !== ATTRACT_TIME) setTime(ATTRACT_TIME);
  render();
  if (state === 'play' || state === 'countdown') renderHUD();
  if (state === 'attract') renderAttract();
  if (state === 'countdown') renderCountdown();
  if (state === 'gameover' || state === 'initials') renderGameOver();
  if (state === 'saving' || state === 'qr') renderQR();
  if (isPortrait()) renderRotateHint();
}

function renderQR() {
  const u = Math.min(W, H) / 100;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = INK;
  ctx.fillRect(0, H * 0.08, W, u * 8);
  text(endTitle(), W / 2, H * 0.08 + u * 5.5,
       { size: u * 4.6, color: PAPER, align: 'center', spacing: 4, weight: 700 });

  // lewa kolumna: wynik
  const lx = W * 0.28;
  text('TWÓJ CZAS', lx, H * 0.30, { size: u * 1.8, color: MUTED, align: 'center', spacing: 4 });
  text(fmtTime(player.score), lx, H * 0.44,
       { size: u * 13, color: BRAND, align: 'center', mono: true, weight: 700 });

  // Pozycja na tablicy to glowny powod, dla ktorego ktos siega po telefon.
  const rank = wouldBeRank(Math.floor(player.score));
  if (rank) {
    const rw = u * 42, rx2 = lx - rw / 2;
    ctx.fillStyle = rank <= 3 ? BRAND : GREY;
    ctx.fillRect(rx2, H * 0.615, rw, u * 6.4);
    text(rank <= 3 ? 'TO ' + rank + '. MIEJSCE NA TABLICY!' : 'TWÓJ CZAS TO ' + rank + '. MIEJSCE',
         lx, H * 0.615 + u * 4.2,
         { size: u * 2.6, color: rank <= 3 ? PAPER : INK, align: 'center', spacing: 2, weight: 700 });
  }

  const stats = [
    ['NAJLEPSZE OKR.', fmtTime(player.bestLap * 1000)],
    ['OKRĄŻENIA', Math.min(player.level, RACE.laps) + '/' + RACE.laps],
    ['ŁADOWARKI', String(player.pickups)]
  ];
  const cw = u * 13, ch = u * 9;
  stats.forEach((s, i) => {
    const x = lx + (i - 1) * (cw + u * 1.5) - cw / 2;
    ctx.fillStyle = GREY;
    ctx.fillRect(x, H * 0.50, cw, ch);
    text(s[0], x + cw / 2, H * 0.50 + u * 3, { size: u * 1.5, color: MUTED, align: 'center', spacing: 2 });
    text(s[1], x + cw / 2, H * 0.50 + u * 7, { size: u * 3.2, color: INK, align: 'center', mono: true, weight: 700 });
  });

  // prawa kolumna: kod QR
  const rx = W * 0.72;
  const qs = Math.min(H * 0.34, W * 0.26);
  const qx = rx - qs / 2, qy = H * 0.30;

  text('ZESKANUJ TELEFONEM', rx, H * 0.255,
       { size: u * 2.4, color: INK, align: 'center', spacing: 3, weight: 700 });

  if (state === 'qr' && qrCanvas) {
    ctx.fillStyle = PAPER;
    ctx.fillRect(qx - u, qy - u, qs + u * 2, qs + u * 2);
    ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ctx.strokeRect(qx - u + 0.5, qy - u + 0.5, qs + u * 2 - 1, qs + u * 2 - 1);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(qrCanvas, qx, qy, qs, qs);
    ctx.imageSmoothingEnabled = true;

    text('KOD: ' + runCode, rx, qy + qs + u * 4.6,
         { size: u * 2.6, color: INK, align: 'center', mono: true, spacing: 3, weight: 700 });

    // Powod, dla ktorego ktos siega po telefon - stad pasek, a nie podpis.
    const pw = qs + u * 10, px = rx - pw / 2, py = qy + qs + u * 6.4;
    ctx.fillStyle = BRAND;
    ctx.fillRect(px, py, pw, u * 8.4);
    text('PODAJ E-MAIL', rx, py + u * 3.4,
         { size: u * 2.5, color: PAPER, align: 'center', spacing: 3, weight: 700 });
    text('I WYGRAJ NAGRODY', rx, py + u * 6.6,
         { size: u * 2.5, color: PAPER, align: 'center', spacing: 3, weight: 700 });
  } else {
    ctx.fillStyle = GREY;
    ctx.fillRect(qx, qy, qs, qs);
    const dots = '.'.repeat(1 + Math.floor(performance.now() / 400) % 3);
    text('ZAPISUJĘ' + dots, rx, qy + qs / 2,
         { size: u * 2.6, color: MUTED, align: 'center', spacing: 2 });
  }

  // stopka
  const left = Math.max(0, Math.ceil(75 - stateT));
  const bw = u * 40, bh = u * 7, bx = W / 2 - bw / 2, by = H * 0.855;
  ctx.fillStyle = Math.floor(performance.now() / 600) % 2 === 0 ? BRAND : INK;
  ctx.fillRect(bx, by, bw, bh);
  text('START — JESZCZE RAZ', W / 2, by + bh * 0.66,
       { size: u * 2.8, color: PAPER, align: 'center', spacing: 3, weight: 700 });
  text('kod działa przez dobę · powrót do ekranu startowego za ' + left + ' s',
       W / 2, H * 0.965, { size: u * 1.6, color: MUTED, align: 'center' });
}

function isPortrait() { return IS_TOUCH && H > W * 1.05; }

function renderRotateHint() {
  const u = Math.min(W, H) / 100;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  logo(W / 2, H * 0.16, u * 5, 'center');
  const t = performance.now() * 0.002;
  const w = u * 22, h = u * 40;
  ctx.save();
  ctx.translate(W / 2, H * 0.44);
  ctx.rotate(-Math.sin(t) * 0.5 - 0.35);
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(2, u * 0.7);
  ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.fillStyle = BRAND;
  ctx.fillRect(-w / 2, h / 2 - u * 3, w, u * 3);
  ctx.restore();
  text('OBRÓĆ TELEFON', W / 2, H * 0.74, { size: u * 5.6, color: INK, align: 'center', spacing: 3, weight: 700 });
  text('GRA DZIAŁA W POZIOMIE', W / 2, H * 0.79, { size: u * 2.4, color: MUTED, align: 'center', spacing: 3 });
}

function tick(dt) {
  stateT += dt;

  // zaniki efektow
  player.hitCooldown = Math.max(0, player.hitCooldown - dt);
  player.shake = Math.max(0, player.shake - dt * 45);
  player.flashRed = Math.max(0, player.flashRed - dt * 3);
  player.flashBrand = Math.max(0, player.flashBrand - dt * 3);
  popups.forEach((p) => { p.life -= dt * 1.1; p.y -= dt * 60; });
  popups = popups.filter((p) => p.life > 0);
  if (state === 'play') levelBanner = Math.max(0, levelBanner - dt);

  if (Input.pressed('mute')) Sfx.toggle();

  switch (state) {
    case 'attract':
      updateAttractDemo(dt);
      fetchBoard();
      if (Input.pressed('start') && !isPortrait()) startRun();
      break;

    case 'saving':
      updateAttractDemo(dt * 0.35);
      if (runCode) { state = 'qr'; stateT = 0; Sfx.ui(); }
      else if (runCodeErr || stateT > 11) fallbackToLocal();
      break;

    case 'qr':
      updateAttractDemo(dt * 0.35);
      fetchBoard();   // zeby pokazac, ktore miejsce dalby ten wynik
      // Kod zyje dobe, wiec nie trzymamy przy nim kolejki - 75 s wystarczy,
      // zeby wyciagnac telefon i zeskanowac.
      if (Input.pressed('start') && stateT > 1.2) startRun();
      if (stateT > 75) { state = 'attract'; stateT = 0; player.speed = maxSpeed * 0.4; }
      break;

    case 'countdown':
      updateCars(dt, findSegment(player.position + playerZ), PLAYER_W);
      countdown -= dt;
      const n = Math.ceil(countdown);
      if (n !== lastBeep) {
        lastBeep = n;
        if (n > 0 && n <= 3) Sfx.start3();
        if (n <= 0) Sfx.start1();
      }
      if (countdown <= 0) { state = 'play'; stateT = 0; }
      break;

    case 'play':
      updatePlay(dt);
      break;

    case 'initials': {
      const tap = Input.consumeTap();
      let handledTap = false;
      if (tap && stateT > 0.4) {
        for (const z of touchZones) {
          if (tap.x >= z.x && tap.x <= z.x + z.w && tap.y >= z.y && tap.y <= z.y + z.h) {
            z.act(); handledTap = true; break;
          }
        }
      }
      if (handledTap) break;
      if (Input.pressed('up')) cycleLetter(initialIdx, 1);
      if (Input.pressed('down')) cycleLetter(initialIdx, -1);
      if (Input.pressed('left')) { initialIdx = (initialIdx + 2) % 3; Sfx.ui(); }
      if (Input.pressed('right')) { initialIdx = (initialIdx + 1) % 3; Sfx.ui(); }
      if (Input.pressed('ok') && stateT > 0.4 && !Input.touchUsed) {
        if (initialIdx < 2) { initialIdx++; Sfx.ui(); }
        else submitInitials();
      }
      break;
    }

    case 'gameover':
      updateAttractDemo(dt * 0.35);
      if (Input.pressed('start') && stateT > 0.8) startRun();
      if (stateT > 25 || (Input.idleMs() > 20000 && stateT > 6)) {
        state = 'attract'; stateT = 0;
        player.speed = maxSpeed * 0.4;
      }
      break;
  }
}
let lastBeep = null;

// ---------------------------------------------------------------- start/boot
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}
document.getElementById('fsbtn').addEventListener('click', () => { toggleFullscreen(); Sfx.resume(); });
window.addEventListener('keydown', (e) => { if (e.code === 'KeyF') toggleFullscreen(); });
window.addEventListener('pointerdown', () => Sfx.resume());

if (IS_TOUCH) CFG.drawDistance = 170;   // telefon nie udzwignie pelnego zasiegu

loadScores();
buildTrack();
resize();
resetRun();
player.speed = maxSpeed * 0.4;
Input.init();
requestAnimationFrame(frame);
</script>
