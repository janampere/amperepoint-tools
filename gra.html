<script>
"use strict";
/* ============================================================================
   AMPERE RUSH — arcade racer, Ampere Point
   Sterowanie: pad (Gamepad API) + klawiatura jako backup.
   Jeden plik, zero zaleznosci, dziala offline na stoisku targowym.
   ========================================================================= */

// ---------------------------------------------------------------- narzedzia
const PI = Math.PI;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const rndInt = (lo, hi) => Math.floor(rnd(lo, hi + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const accelToward = (v, target, rate, dt) => v + clamp(target - v, -rate * dt, rate * dt);
const easeIn = (a, b, p) => a + (b - a) * Math.pow(p, 2);
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * PI) / 2 + 0.5);
const fogAt = (d, density) => 1 / Math.pow(Math.E, d * d * density);
const overlap = (x1, w1, x2, w2, pct) => {
  const h1 = w1 * (pct || 1) / 2, h2 = w2 * (pct || 1) / 2;
  return !((x1 + h1 < x2 - h2) || (x1 - h1 > x2 + h2));
};

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ------------------------------------------------------------------- config
// Paleta i typografia 1:1 ze storefrontu amperepoint.pl (motyw Shopify):
// Geist 400/600, kolory schematow motywu, zero zaokraglen, zero cieni.
const BRAND = '#FF6B00';   // pomarancz z logo
const BLUE = '#334FB4';    // accent-2 z motywu
const INK = '#121212';     // accent-1 / kolor tekstu
const PAPER = '#FFFFFF';   // background-1
const GREY = '#F3F3F3';    // background-2
const LINE = '#D8DCE3';
const MUTED = '#6B7280';

const LOGO_URL = 'https://cdn.shopify.com/s/files/1/0780/2218/1190/files/Ampere_Point_Version_2_small_200px.png?v=1695645866';
const logoImg = new Image();
let logoReady = false;
logoImg.onload = () => { logoReady = true; };
logoImg.src = LOGO_URL;

// Zdjecia produktowe prosto ze sklepu. Parametr width zalatwia CDN Shopify -
// nie ma po co ciagnac na stoisko plikow po kilka MB.
function loadImg(src) {
  const ref = { img: new Image(), ready: false };
  ref.img.decoding = 'async';
  ref.img.onload = () => { ref.ready = ref.img.naturalWidth > 0; };
  ref.img.src = src;
  return ref;
}
// Ladowarki na trasie: zdjecia ze sklepu z wycietym tlem (PNG w repo), zeby
// wisialy na slupku jak prawdziwe urzadzenie, a nie jak plakat.
const imgPrime = loadImg('prime-cut.png');
const imgQ11 = loadImg('q11-cut.png');
// Zdjecie Omody leci tylko do banera nagrody - to kadr z tlem, wiec jako
// sprite na jezdni wygladalby jak latajacy prostokat. Na e-Mobility Omoda 5
// (biala, na sniegu - grudzien), na KNM byla Omoda 9.
const imgOmoda = loadImg('omoda5-cut.png');   // nasze zdjecie ze sklepu, wyciete z tla

// Zdjecia nagrod na ekran tytulowy - to one maja zatrzymac przechodzacego.
const imgSeriaB = loadImg('https://cdn.shopify.com/s/files/1/0780/2218/1190/files/ampere_point_b35_ladowarka_Schuko_230V_1.jpg?v=1765364614&width=480');
const imgStorm = loadImg('https://cdn.shopify.com/s/files/1/0780/2218/1190/files/dr_storm_ampere_point_socket_square.jpg?v=1768991336&width=480');

const IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
const CFG = {
  segmentLength: 200,
  rumbleLength: 3,
  lanes: 3,
  roadWidth: 2000,
  cameraHeight: 1100,
  drawDistance: 240,
  fieldOfView: 100,
  fogDensity: 4,
  centrifugal: 0.32,
  distDivisor: 180,      // jednostki swiata -> metry (spojne z topSpeedKmh)
  topSpeedKmh: 240
};
const cameraDepth = 1 / Math.tan((CFG.fieldOfView / 2) * PI / 180);
const playerZ = CFG.cameraHeight * cameraDepth;
const maxSpeed = CFG.segmentLength / (1 / 60);
const accelRate = maxSpeed / 4.2;
const brakeRate = -maxSpeed / 1.6;
const decelRate = -maxSpeed / 6;
const offRoadDecel = -maxSpeed / 2.2;
const offRoadLimit = maxSpeed / 3.4;
// Auto gracza rysujemy w stalym rozmiarze ekranowym (~0.195 szerokosci
// kadru), co w jednostkach swiata wychodzi ~480. Ruch uliczny mial 980,
// czyli dwa razy tyle - stad wrazenie, ze inni jezdza czolgami.
const PLAYER_W = 480;
const TRAFFIC_W = 500;
const OMODA_LEVEL = 3;   // ostatnie okrazenie jedzie sie Omoda - final wyscigu

// Wyscig na czas: 3 okrazenia, wygrywa najkrotszy czas. Na KNM gralo sie na
// punkty bez konca i rekordzisci zajmowali stanowisko po godzinie.
const RACE = { laps: 3, maxSec: 300 };   // po 5 minutach przejazd sie konczy bez czasu
// Ladowarka = doladowanie baterii i turbo. Seria ladowarek wydluza turbo.
// Pierwsza wersja (x1.35, ostre wejscie) wyrzucala z zakretow. Teraz turbo
// dodaje mniej i narasta/opada plynnie.
const TURBO = { mult: 1.18, base: 2.2, perStreak: 0.6, max: 4.0, push: 1.3, fade: 0.6 };
const LIMP = 0.55;   // tryb awaryjny przy pustej baterii: ulamek predkosci
// Bateria schodzi wolniej niz na KNM - tam pusta bateria konczyla gre i
// napiecie bralo sie z tego. Tu ma tylko zmuszac do zjazdu po ladowarke.
const DRAIN = 0.7;   // 0.6: awaryjny prawie nigdy; 0.8: bez ladowarek ponad 4 min jazdy

// 151234 ms -> "2:31.23". Setne, bo przy kilkuset przejazdach dziesiate
// czesci sekundy czesto by sie powtarzaly.
function fmtTime(ms) {
  if (!(ms > 0)) return '-:--.--';
  const t = Math.floor(ms / 10);
  const m = Math.floor(t / 6000), sec = Math.floor((t % 6000) / 100), d = String(t % 100).padStart(2, '0');
  return m + ':' + String(sec).padStart(2, '0') + '.' + d;
}

// Kazde okrazenie to nowy poziom. Rosnie predkosc, ruch i zuzycie pradu,
// a na trasie budza sie pachołki uspione na starcie - zeby po kilku
// minutach nie dalo sie jechac z palcem w nosie.
const LEVEL = {
  speedStep: 0.07, speedMax: 1.55,
  carsStep: 3, carsMax: 30,
  drainStep: 0.12, drainMax: 1.8,
  bonus: 1000
};
function speedCap() {
  return maxSpeed * Math.min(LEVEL.speedMax, 1 + (player.level - 1) * LEVEL.speedStep);
}
function drainScale() {
  return Math.min(LEVEL.drainMax, 1 + (player.level - 1) * LEVEL.drainStep);
}

const COLORS = {
  light:  { road: '#22252B', grass: '#EEF0F4', rumble: '#E4E7EC', lane: PAPER },
  dark:   { road: '#1C1F24', grass: '#E9ECF1', rumble: BRAND },
  start:  { road: PAPER, grass: '#EEF0F4', rumble: PAPER },
  charge: { road: '#26292F', grass: '#E9ECF1', rumble: BRAND, lane: '#FFB27A' }
};

// Edycja e-Mobility w klimacie GTA VI: kazde okrazenie to inna pora dnia na
// nadmorskiej autostradzie. Start od razu o zachodzie slonca - najbardziej
// rozpoznawalny kadr ma byc od pierwszej sekundy, nie od drugiego okrazenia.
// Jezdnia, krawedz i HUD zostaja nasze. Bierzemy klimat (kolory, palmy,
// ocean, promenada), nie szate graficzna Rockstara.
const SEASONS = [
  { name: 'ZACHÓD SŁOŃCA', grass: '#E9B49A', grassAlt: '#E2A98E', walk: '#F3C9B4', curb: '#FFFFFF',
    palm: '#3A1A4F', trunk: '#3A1A4F', sky: ['#4B2A7B', '#FF5FA2', '#FFB25B'],
    sun: { y: 0.44, r: 0.12, c1: '#FFE66B', c2: '#FF4F8B', stripes: true },
    sea: '#7A3D8F', city: 'rgba(58,26,79,0.80)', fog: '#FFB89A', ink: INK, night: false },
  { name: 'NEONOWA NOC', grass: '#1B1233', grassAlt: '#160E2B', walk: '#34264F', curb: '#FF5FA2',
    palm: '#0B0618', trunk: '#0B0618', sky: ['#07051A', '#24104A', '#6A1E73'],
    sun: null, sea: '#120A2E', city: 'rgba(10,6,28,0.96)', fog: '#2A1240', ink: PAPER, night: true },
  { name: 'ŚWIT', grass: '#F0DCCB', grassAlt: '#EAD2BF', walk: '#F7E6DA', curb: '#FFFFFF',
    palm: '#6C5A8E', trunk: '#6C5A8E', sky: ['#8FBCE6', '#F7C6DA', '#FFE2B8'],
    sun: { y: 0.45, r: 0.055, c1: '#FFF3D1', c2: '#FFC9A8', stripes: false },
    sea: '#8FB7D9', city: 'rgba(108,90,142,0.35)', fog: '#FFE9D2', ink: INK, night: false },
  { name: 'POŁUDNIE', grass: '#F2E3C4', grassAlt: '#ECDBB8', walk: '#FAF1E2', curb: '#FFFFFF',
    palm: '#2F8F6B', trunk: '#9C7A55', sky: ['#2FA8D5', '#9EE0EC', '#FFF4DC'],
    sun: { y: 0.22, r: 0.045, c1: '#FFFBE6', c2: '#FFE08A', stripes: false },
    sea: '#22A9C4', city: 'rgba(40,70,110,0.20)', fog: '#FFF4DC', ink: INK, night: false }
];
let season = SEASONS[0];
// Ekran tytulowy o zachodzie - jak pierwsze okrazenie.
const ATTRACT_TIME = SEASONS[0];

// Segmenty trzymaja referencje do obiektow z COLORS, wiec wystarczy
// podmienic w nich kolor trawy - cala trasa zmienia sie w jednej klatce.
function setTime(t) {
  season = t;
  COLORS.light.grass = t.grass;
  COLORS.start.grass = t.grass;
  COLORS.dark.grass = t.grassAlt;
  COLORS.charge.grass = t.grassAlt;
}
function applySeason(level) {
  setTime(SEASONS[(level - 1) % SEASONS.length]);
}

// -------------------------------------------------------------------- audio
const Sfx = {
  ctx: null, master: null, engine: null, engGain: null, engFilter: null,
  enabled: true, started: false,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.enabled ? 0.55 : 0;
    this.master.connect(this.ctx.destination);

    this.engFilter = this.ctx.createBiquadFilter();
    this.engFilter.type = 'lowpass';
    this.engFilter.frequency.value = 900;
    this.engGain = this.ctx.createGain();
    this.engGain.gain.value = 0;
    this.engFilter.connect(this.engGain);
    this.engGain.connect(this.master);

    // Elektryk: dwa piloty zamiast warkotu spalinowego.
    this.engine = [];
    [1, 2.02].forEach((mul, i) => {
      const o = this.ctx.createOscillator();
      o.type = i ? 'sawtooth' : 'triangle';
      o.frequency.value = 120 * mul;
      const g = this.ctx.createGain();
      g.gain.value = i ? 0.25 : 0.6;
      o.connect(g); g.connect(this.engFilter);
      o.start();
      this.engine.push(o);
    });
  },
  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    this.started = true;
  },
  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.value = this.enabled ? 0.55 : 0;
  },
  engineUpdate(speedPct, offRoad) {
    if (!this.ctx || !this.engine) return;
    const t = this.ctx.currentTime;
    const base = 110 + speedPct * 520;
    this.engine[0].frequency.setTargetAtTime(base, t, 0.08);
    this.engine[1].frequency.setTargetAtTime(base * 2.02, t, 0.08);
    this.engFilter.frequency.setTargetAtTime(600 + speedPct * 2600, t, 0.1);
    this.engGain.gain.setTargetAtTime(speedPct > 0.02 ? 0.06 + speedPct * 0.13 : 0, t, 0.1);
    if (offRoad && speedPct > 0.2 && Math.random() < 0.25) this.noise(0.05, 0.05, 1800);
  },
  blip(freq, dur, type, vol) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.28, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + (dur || 0.12) + 0.02);
    return o;
  },
  noise(dur, vol, freq) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq || 800; f.Q.value = 0.8;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.2;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  pickup(streak) {
    const base = 660 * Math.pow(1.06, Math.min(streak, 12));
    const o = this.blip(base, 0.16, 'square', 0.22);
    if (o && this.ctx) o.frequency.exponentialRampToValueAtTime(base * 1.6, this.ctx.currentTime + 0.14);
  },
  crash() { this.noise(0.35, 0.4, 320); this.blip(90, 0.3, 'sawtooth', 0.25); },
  ui() { this.blip(520, 0.07, 'square', 0.18); },
  levelUp() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, 0.18, 'square', 0.26), i * 90));
  },
  start3() { this.blip(440, 0.18, 'square', 0.25); },
  start1() { this.blip(880, 0.4, 'square', 0.3); },
  gameover() {
    if (!this.ctx) return;
    [440, 330, 262, 196].forEach((f, i) => setTimeout(() => this.blip(f, 0.28, 'square', 0.22), i * 180));
  }
};

// ------------------------------------------------------------------- muzyka
// Wlasny podklad synthwave generowany na zywo (Web Audio), bez plikow.
// Klimat radia z lat 80., ale nasza progresja i aranzacja - zadnej cudzej
// muzyki (utwory z GTA sa licencjonowane, na stoisku byloby to publiczne
// odtwarzanie). Gra tylko w trakcie wyscigu, zeby obsluga stoiska nie
// sluchala petli caly dzien. Wycisza ja ten sam przycisk co efekty.
const Music = {
  bus: null, delay: null, noiseBuf: null, timer: null,
  step: 0, nextT: 0, bpm: 100, lap: 1, playing: false,
  // a-moll: Am - F - C - G, po takcie na akord
  CHORDS: [
    { root: 45, pad: [57, 60, 64] },
    { root: 41, pad: [53, 57, 60] },
    { root: 48, pad: [52, 55, 60] },
    { root: 43, pad: [50, 55, 59] }
  ],
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  setup() {
    if (this.bus || !Sfx.ctx) return;
    const c = Sfx.ctx;
    this.bus = c.createGain();
    this.bus.gain.value = 0;
    this.bus.connect(Sfx.master);
    // echo na arpeggio - bez niego brzmi jak dzwonek
    this.delay = c.createDelay(1);
    const fb = c.createGain(); fb.gain.value = 0.32;
    const wet = c.createGain(); wet.gain.value = 0.4;
    this.delay.connect(fb); fb.connect(this.delay);
    this.delay.connect(wet); wet.connect(this.bus);
    const len = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  start() {
    Sfx.init();
    if (!Sfx.ctx) return;
    this.setup();
    const t = Sfx.ctx.currentTime;
    this.bus.gain.cancelScheduledValues(t);
    this.bus.gain.setValueAtTime(this.bus.gain.value, t);
    this.bus.gain.linearRampToValueAtTime(0.42, t + 0.8);
    this.step = 0;
    this.nextT = t + 0.1;
    this.setLap(1);
    this.playing = true;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop(fade) {
    if (!this.playing || !Sfx.ctx) return;
    this.playing = false;
    const f = fade || 1.5, t = Sfx.ctx.currentTime;
    this.bus.gain.cancelScheduledValues(t);
    this.bus.gain.setValueAtTime(this.bus.gain.value, t);
    this.bus.gain.linearRampToValueAtTime(0, t + f);
    setTimeout(() => { if (!this.playing) clearInterval(this.timer); }, f * 1000 + 150);
  },
  // kazde okrazenie szybciej i gesciej
  setLap(l) {
    this.lap = Math.min(3, Math.max(1, l));
    this.bpm = [100, 106, 112][this.lap - 1];
    if (this.delay) this.delay.delayTime.value = (60 / this.bpm) * 0.75;
  },
  tick() {
    const c = Sfx.ctx;
    if (!c) return;
    while (this.nextT < c.currentTime + 0.15) {
      this.play(this.step, this.nextT);
      this.nextT += 60 / this.bpm / 4;
      this.step++;
    }
  },
  play(step, t) {
    const s = step % 16, bar = Math.floor(step / 16);
    const ch = this.CHORDS[bar % 4], lap = this.lap, six = 60 / this.bpm / 4;
    if (s % 4 === 0) this.kick(t);
    if (s === 4 || s === 12) this.snare(t);
    if (s % 2 === 0 || lap >= 2) this.hat(t, s % 4 === 2 ? 0.10 : 0.05);
    if (s % 2 === 0) this.bass(this.hz(ch.root + (s % 4 === 2 ? 12 : 0)), t, six * 1.8);
    if (s === 0) this.pad(ch.pad, t, six * 16);
    if (lap >= 2) {
      const pat = [0, 1, 2, 1];
      const up = lap >= 3 && s >= 8 ? 24 : 12;
      this.lead(this.hz(ch.pad[pat[s % 4]] + up), t, six * 0.9);
    }
  },
  env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  kick(t) {
    const c = Sfx.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
    this.env(g, t, 0.002, 0.9, 0.28);
    o.connect(g); g.connect(this.bus);
    o.start(t); o.stop(t + 0.35);
  },
  noise(t, type, freq, peak, d) {
    const c = Sfx.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf;
    f.type = type; f.frequency.value = freq; f.Q.value = 0.7;
    this.env(g, t, 0.001, peak, d);
    src.connect(f); f.connect(g); g.connect(this.bus);
    src.start(t, Math.random() * 0.5); src.stop(t + d + 0.05);
  },
  snare(t) {
    this.noise(t, 'bandpass', 1700, 0.42, 0.2);
    const c = Sfx.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = 190;
    this.env(g, t, 0.001, 0.25, 0.08);
    o.connect(g); g.connect(this.bus);
    o.start(t); o.stop(t + 0.12);
  },
  hat(t, v) { this.noise(t, 'highpass', 7000, v, 0.04); },
  bass(f, t, d) {
    const c = Sfx.ctx, lp = c.createBiquadFilter(), g = c.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 450 + this.lap * 150; lp.Q.value = 4;
    this.env(g, t, 0.005, 0.3, d);
    lp.connect(g); g.connect(this.bus);
    [1, 1.006].forEach((m) => {
      const o = c.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f * m;
      o.connect(lp); o.start(t); o.stop(t + d + 0.05);
    });
  },
  pad(notes, t, d) {
    const c = Sfx.ctx, lp = c.createBiquadFilter(), g = c.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 1300;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.5);
    g.gain.setValueAtTime(0.05, t + d - 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + d);
    lp.connect(g); g.connect(this.bus);
    notes.forEach((n) => [-7, 7].forEach((cents) => {
      const o = c.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = this.hz(n); o.detune.value = cents;
      o.connect(lp); o.start(t); o.stop(t + d + 0.05);
    }));
  },
  lead(f, t, d) {
    const c = Sfx.ctx, o = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
    o.type = 'square'; o.frequency.value = f;
    lp.type = 'lowpass'; lp.frequency.value = 2600;
    this.env(g, t, 0.003, 0.05, d);
    o.connect(lp); lp.connect(g); g.connect(this.bus); g.connect(this.delay);
    o.start(t); o.stop(t + d + 0.05);
  }
};

// -------------------------------------------------------------------- input
const Input = {
  steer: 0, accel: 0, brake: 0,
  pad: null, padName: '',
  keys: {}, latch: {},
  down: {}, prev: {},
  lastActivity: 0,
  touches: [], tapLatch: false, tapPoint: null, touchUsed: false,

  init() {
    this.initTouch();
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      this.keys[e.code] = true;
      this.latch[e.code] = true;   // krotkie tapniecie nie moze zginac miedzy klatkami
      this.lastActivity = performance.now();
      Sfx.resume();
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    window.addEventListener('gamepadconnected', (e) => {
      this.padName = e.gamepad.id.slice(0, 28);
      Sfx.resume();
    });
    window.addEventListener('gamepaddisconnected', () => { this.padName = ''; });
  },

  initTouch() {
    const sync = (e) => {
      this.touches = Array.from(e.touches).map((t) => ({ x: t.clientX, y: t.clientY }));
      this.lastActivity = performance.now();
    };
    const start = (e) => {
      e.preventDefault();
      sync(e);
      this.touchUsed = true;
      this.tapLatch = true;
      const t = e.changedTouches[0];
      this.pendingTap = { x: t.clientX, y: t.clientY };
      Sfx.resume();
    };
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); sync(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); sync(e); }, { passive: false });
    canvas.addEventListener('touchcancel', sync, { passive: false });
  },

  poll() {
    this.prev = Object.assign({}, this.down);
    const d = { start: false, ok: false, back: false, up: false, down: false, left: false, right: false, mute: false };
    let steer = 0, accel = 0, brake = 0, digital = true;

    // --- pad ---
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (const p of pads) if (p && p.connected) { gp = p; break; }
    this.pad = gp;
    if (gp) {
      if (!this.padName) this.padName = gp.id.slice(0, 28);
      const btn = (i) => gp.buttons[i] ? (gp.buttons[i].value > 0.2 || gp.buttons[i].pressed) : false;
      const val = (i) => gp.buttons[i] ? gp.buttons[i].value : 0;
      const ax = (i) => gp.axes.length > i ? gp.axes[i] : 0;

      let a0 = ax(0);
      if (Math.abs(a0) < 0.18) a0 = 0;
      if (a0 !== 0) { steer = a0; digital = false; }
      if (btn(14)) steer = -1;
      if (btn(15)) steer = 1;

      accel = Math.max(val(7), btn(0) ? 1 : 0);              // RT lub A/X
      brake = Math.max(val(6), btn(1) ? 1 : 0, btn(2) ? 1 : 0); // LT lub B/O

      d.start = btn(9) || btn(0);
      d.ok = btn(0) || btn(9);
      d.back = btn(1) || btn(8);
      d.up = btn(12) || ax(1) < -0.6;
      d.down = btn(13) || ax(1) > 0.6;
      d.left = btn(14) || ax(0) < -0.6;
      d.right = btn(15) || ax(0) > 0.6;
      d.mute = btn(3);

      if (Math.abs(steer) > 0.2 || accel > 0.2 || brake > 0.2 || d.start || d.back) this.lastActivity = performance.now();
    }

    // --- klawiatura (backup / testy) ---
    const k = (c) => !!(this.keys[c] || this.latch[c]);
    const left = k('ArrowLeft') || k('KeyA'), right = k('ArrowRight') || k('KeyD');
    const up = k('ArrowUp') || k('KeyW'), dn = k('ArrowDown') || k('KeyS');
    if (left) steer = -1;
    if (right) steer = 1;
    if (this.keys.ArrowUp || this.keys.KeyW) accel = 1;
    if (this.keys.ArrowDown || this.keys.KeyS) brake = 1;
    if (k('Enter') || k('Space')) { d.start = true; d.ok = true; }
    if (k('Escape')) d.back = true;
    if (up) d.up = true;
    if (dn) d.down = true;
    if (left) d.left = true;
    if (right) d.right = true;
    if (k('KeyM')) d.mute = true;
    if (Object.values(this.keys).some(Boolean)) this.lastActivity = performance.now();
    this.latch = {};

    // --- dotyk (telefon/tablet) ---
    // Gaz jedzie sam, gracz tylko skreca - na malym ekranie wiecej przyciskow
    // niz palcow. Srodkowy pas ekranu = hamulec.
    this.tapPoint = this.pendingTap || null;   // tap zyje dokladnie jedna klatke
    this.pendingTap = null;
    if (this.touchUsed) {
      let s = 0, braking = false;
      for (const t of this.touches) {
        if (t.x < W * 0.40) s -= 1;
        else if (t.x > W * 0.60) s += 1;
        else braking = true;
      }
      steer = clamp(s, -1, 1);
      brake = braking ? 1 : 0;
      accel = braking ? 0 : 1;
      if (this.tapLatch) { d.start = true; d.ok = true; }
    }
    this.tapLatch = false;

    // Wejscia cyfrowe (dotyk, klawiatura, d-pad) wygladzamy - bez tego auto
    // szarpie na pelen wychyl w jednej klatce. Analog z drazka idzie bez zmian.
    const target = clamp(steer, -1, 1);
    if (digital) {
      const rate = target === 0 ? 0.35 : 0.2;
      this.steer = clamp(this.steer + (target - this.steer) * rate, -1, 1);
      if (Math.abs(this.steer) < 0.02) this.steer = 0;
    } else {
      this.steer = target;
    }
    this.accel = clamp(accel, 0, 1);
    this.brake = clamp(brake, 0, 1);
    this.down = d;
  },

  pressed(name) { return this.down[name] && !this.prev[name]; },
  consumeTap() { const p = this.tapPoint; this.tapPoint = null; return p; },
  idleMs() { return performance.now() - this.lastActivity; }
};

// ------------------------------------------------------------------ sprites
// Wszystko rysowane proceduralnie - zero plikow graficznych, dziala offline.

function drawShadow(ctx, x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + h * 0.97, w * 0.46, h * 0.09, 0, 0, PI * 2);
  ctx.fill();
}

function drawCar(ctx, x, y, w, h, c, opts) {
  opts = opts || {};
  drawShadow(ctx, x, y, w, h);
  // kola
  ctx.fillStyle = INK;
  ctx.fillRect(x + w * 0.005, y + h * 0.56, w * 0.15, h * 0.38);
  ctx.fillRect(x + w * 0.845, y + h * 0.56, w * 0.15, h * 0.38);
  // nadwozie
  ctx.fillStyle = c.body;
  ctx.fillRect(x + w * 0.05, y + h * 0.28, w * 0.90, h * 0.64);
  // dach
  ctx.fillStyle = c.roof || c.body;
  ctx.fillRect(x + w * 0.17, y + h * 0.02, w * 0.66, h * 0.46);
  // szyba
  ctx.fillStyle = c.glass;
  ctx.fillRect(x + w * 0.22, y + h * 0.09, w * 0.56, h * 0.26);
  // swiatla
  ctx.fillStyle = c.light;
  ctx.fillRect(x + w * 0.09, y + h * 0.50, w * 0.22, h * 0.10);
  ctx.fillRect(x + w * 0.69, y + h * 0.50, w * 0.22, h * 0.10);
  // zderzak
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(x + w * 0.07, y + h * 0.80, w * 0.86, h * 0.08);
  if (opts.boost) {
    ctx.fillStyle = BRAND;
    ctx.fillRect(x + w * 0.22, y + h * 0.90, w * 0.56, h * 0.05);
  }
}

// Slupek z ladowarka - wspolna podstawa dla obu produktow.
function drawStand(ctx, x, y, w, h, t) {
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.006);
  ctx.globalAlpha = 0.25 + 0.35 * pulse;
  ctx.fillStyle = BRAND;
  ctx.fillRect(x - w * 0.25, y + h * 0.95, w * 1.5, h * 0.05);
  ctx.globalAlpha = 1;
  ctx.fillStyle = INK;
  ctx.fillRect(x + w * 0.20, y + h * 0.90, w * 0.60, h * 0.10);   // podstawa
  ctx.fillStyle = '#C9CED8';
  ctx.fillRect(x + w * 0.40, y + h * 0.45, w * 0.20, h * 0.47);   // slup
}

// Ladowarka zamocowana na slupku: wyciete zdjecie produktu na gorze slupa,
// pod nim mala pomaranczowa tabliczka z nazwa. Bez bialej kartki.
function drawProductStand(ctx, x, y, w, h, t, ref, name, fallback) {
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.006);
  // poswiata na asfalcie - ladowarke widac z daleka
  ctx.globalAlpha = 0.25 + 0.35 * pulse;
  ctx.fillStyle = BRAND;
  ctx.fillRect(x - w * 0.25, y + h * 0.95, w * 1.5, h * 0.05);
  ctx.globalAlpha = 1;
  // podstawa i slup
  ctx.fillStyle = INK;
  ctx.fillRect(x + w * 0.30, y + h * 0.92, w * 0.40, h * 0.08);
  ctx.fillStyle = season.night ? '#8A90A0' : '#B8BEC9';
  ctx.fillRect(x + w * 0.44, y + h * 0.20, w * 0.12, h * 0.74);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(x + w * 0.52, y + h * 0.20, w * 0.04, h * 0.74);

  // urzadzenie na gorze slupa
  const iw = w * 1.05, ih = h * 0.52;
  const ix = x + (w - iw) / 2, iy = y;
  if (ref.ready) {
    const ar = ref.img.naturalWidth / ref.img.naturalHeight;
    let dw = iw, dh = iw / ar;
    if (dh > ih) { dh = ih; dw = ih * ar; }
    ctx.drawImage(ref.img, ix + (iw - dw) / 2, iy + (ih - dh) / 2, dw, dh);
  } else {
    fallback(ctx, ix + iw * 0.15, iy, iw * 0.7, ih);
  }

  // tabliczka z nazwa na slupie
  const pw = w * 0.56, ph = h * 0.075, px = x + (w - pw) / 2, py = y + h * 0.62;
  ctx.fillStyle = BRAND;
  ctx.fillRect(px, py, pw, ph);
  if (pw > 30) {
    ctx.fillStyle = PAPER;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.floor(ph * 0.66) + 'px Geist, Arial, sans-serif';
    ctx.fillText(name, x + w / 2, py + ph * 0.54);
  }
}

// Rysunki zapasowe - gdy zdjecie ze sklepu nie dojedzie.
function primeIcon(ctx, x, y, w, h) {
  ctx.fillStyle = INK;
  ctx.fillRect(x + w * 0.18, y, w * 0.64, h);
  ctx.fillStyle = '#2E3440';
  ctx.fillRect(x + w * 0.28, y + h * 0.12, w * 0.44, h * 0.42);
  ctx.fillStyle = BRAND;
  ctx.fillRect(x + w * 0.28, y + h * 0.62, w * 0.44, h * 0.14);
}

function q11Icon(ctx, x, y, w, h) {
  ctx.fillStyle = '#D7DBE2';
  ctx.fillRect(x + w * 0.22, y + h * 0.10, w * 0.56, h * 0.58);
  ctx.fillStyle = INK;
  ctx.fillRect(x + w * 0.32, y + h * 0.22, w * 0.36, h * 0.28);
  ctx.fillStyle = '#C2401F';
  ctx.fillRect(x + w * 0.36, y + h * 0.78, w * 0.28, h * 0.16);
}

function drawPrime(ctx, x, y, w, h, t) {
  drawProductStand(ctx, x, y, w, h, t, imgPrime, 'PRIME', primeIcon);
}

function drawQ11(ctx, x, y, w, h, t) {
  drawProductStand(ctx, x, y, w, h, t, imgQ11, 'Q11', q11Icon);
}

function drawCone(ctx, x, y, w, h) {
  drawShadow(ctx, x, y, w, h);
  ctx.fillStyle = BRAND;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.5, y);
  ctx.lineTo(x + w * 0.88, y + h * 0.92);
  ctx.lineTo(x + w * 0.12, y + h * 0.92);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = PAPER;
  ctx.fillRect(x + w * 0.26, y + h * 0.45, w * 0.48, h * 0.14);
  ctx.fillStyle = INK;
  ctx.fillRect(x + w * 0.06, y + h * 0.9, w * 0.88, h * 0.1);
}

// Palma: lekko wygiety pien i wachlarz lisci. Plaska sylwetka w kolorze
// pory dnia - tlo, nie bohater kadru.
const PALM_LEAVES = [   // kierunek (rad, 0 = w prawo) i dlugosc wzgledem szerokosci
  [Math.PI * 0.92, 0.50], [-Math.PI * 0.85, 0.46], [-Math.PI * 0.62, 0.36],
  [-Math.PI * 0.36, 0.38], [-Math.PI * 0.12, 0.46], [Math.PI * 0.10, 0.50]
];
function drawTree(ctx, x, y, w, h) {
  const tx = x + w * 0.56, ty = y + h * 0.24;
  ctx.strokeStyle = season.trunk;
  ctx.lineWidth = Math.max(1, w * 0.065);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.48, y + h);
  ctx.quadraticCurveTo(x + w * 0.40, y + h * 0.55, tx, ty);
  ctx.stroke();
  ctx.lineCap = 'butt';

  ctx.fillStyle = season.palm;
  for (const [a, len] of PALM_LEAVES) {
    const L = w * len;
    const ex = tx + Math.cos(a) * L;
    const ey = ty + Math.sin(a) * L + L * 0.35;   // koncowka opada
    const mx = (tx + ex) / 2, my = (ty + ey) / 2;
    const bulge = L * 0.22;   // lisc wygiety lukiem do gory
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(mx, my - bulge, ex, ey);
    ctx.quadraticCurveTo(mx, my + bulge * 0.2, tx, ty);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(tx, ty, w * 0.05, 0, Math.PI * 2);
  ctx.fill();
}

// ---------------------------------------------------------- zycie na promenadzie
// Malo postaci, ale kazda cos robi: rowerzysta jedzie, barman wstrzasa
// shakerem, ktos liże loda. Tlum stojacych ludzikow wygladal jak makieta.
const PERSON_SHIRTS = ['#FF5FA2', '#2EC4B6', '#FFD23F', '#FFFFFF', '#FF8C42', '#7B5CD6', '#3FE0F0'];
const PERSON_SKIN = ['#F1C7A3', '#E0AC83', '#C68E5E', '#8D5A3B', '#5C3A26'];
const PERSON_PANTS = ['#2B4C7E', '#E8E1D3', '#121212', '#4A8F6B', '#F4F4F4'];
function randomLook() {
  return {
    shirt: pick(PERSON_SHIRTS), skin: pick(PERSON_SKIN), pants: pick(PERSON_PANTS),
    hat: Math.random() < 0.3 ? pick(['#FFFFFF', '#FFD23F', '#121212']) : null,
    shades: Math.random() < 0.5, flowers: Math.random() < 0.3, phase: Math.random() * 6.28
  };
}

// Postac stoi stopami na fy, ph = wzrost w pikselach. Poza mowi, co robi.
function drawPerson(ctx, cx, fy, ph, k, pose, t) {
  const w = ph * 0.42;
  const tt = (t || 0) * 0.001 + k.phase;
  let bob = 0, legA = 0, armL = 0, armR = 0;   // ramiona: 0 = w dol, 1 = w gore
  if (pose === 'walk') { legA = Math.sin(tt * 7); }
  if (pose === 'jog') { legA = Math.sin(tt * 12); bob = Math.abs(Math.sin(tt * 12)) * ph * 0.03; }
  if (pose === 'dance') { bob = Math.abs(Math.sin(tt * 6)) * ph * 0.05; armL = Math.sin(tt * 6) > 0 ? 1 : 0.3; armR = 1.3 - armL; legA = Math.sin(tt * 6) * 0.5; }
  if (pose === 'drink') { armR = Math.sin(tt * 1.6) > 0.2 ? 1 : 0; }
  if (pose === 'lick') { armR = 0.8 + Math.sin(tt * 3) * 0.12; }
  if (pose === 'shake') { armL = armR = 0.75 + Math.sin(tt * 18) * 0.25; }
  if (pose === 'wave') { armR = 0.85 + Math.sin(tt * 8) * 0.15; }
  if (pose === 'jump') { bob = Math.max(0, Math.sin(tt * 5)) * ph * 0.12; armL = armR = bob > ph * 0.06 ? 1 : 0.2; }
  const y = fy - ph - bob;
  // nogi
  ctx.fillStyle = k.skin;
  ctx.fillRect(cx - w * 0.16 + legA * w * 0.10, y + ph * 0.62, w * 0.12, ph * 0.38);
  ctx.fillRect(cx + w * 0.04 - legA * w * 0.10, y + ph * 0.62, w * 0.12, ph * 0.38);
  ctx.fillStyle = k.pants;
  ctx.fillRect(cx - w * 0.20, y + ph * 0.52, w * 0.40, ph * 0.16);
  // tulow
  ctx.fillStyle = k.shirt;
  ctx.fillRect(cx - w * 0.24, y + ph * 0.22, w * 0.48, ph * 0.32);
  if (k.flowers) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 5; i++) ctx.fillRect(cx - w * 0.18 + (i % 3) * w * 0.14, y + ph * (0.26 + Math.floor(i / 3) * 0.12), w * 0.06, ph * 0.03);
  }
  // rece: dlugosc stala, kierunek wg pozy
  const arm = (side, up) => {
    const ax = side < 0 ? cx - w * 0.34 : cx + w * 0.24;
    const len = ph * 0.26;
    ctx.fillStyle = k.skin;
    if (up > 0.5) ctx.fillRect(ax, y + ph * 0.24 - len * up, w * 0.10, len * up + ph * 0.02);
    else ctx.fillRect(ax, y + ph * 0.24, w * 0.10, len * (1 - up * 0.6));
    return { x: ax + w * 0.05, y: up > 0.5 ? y + ph * 0.24 - len * up : y + ph * 0.24 + len };
  };
  arm(-1, armL);
  const hand = arm(1, armR);
  if (pose === 'drink' || pose === 'shake') {      // szklanka / shaker w dloni
    ctx.fillStyle = pose === 'shake' ? '#C9CED8' : '#FF8C42';
    ctx.fillRect(hand.x - w * 0.07, hand.y - ph * 0.07, w * 0.14, ph * 0.08);
  }
  if (pose === 'lick') {                             // lod w wafelku
    ctx.fillStyle = '#E0A458';
    ctx.fillRect(hand.x - w * 0.05, hand.y - ph * 0.05, w * 0.10, ph * 0.08);
    ctx.fillStyle = pick2(k, ['#FF9EC7', '#FFF4C2', '#A6E3D0']);
    ctx.fillRect(hand.x - w * 0.08, hand.y - ph * 0.10, w * 0.16, ph * 0.06);
  }
  // glowa
  ctx.fillStyle = k.skin;
  ctx.fillRect(cx - w * 0.14, y + ph * 0.04, w * 0.28, ph * 0.17);
  if (k.shades) { ctx.fillStyle = '#121212'; ctx.fillRect(cx - w * 0.14, y + ph * 0.10, w * 0.28, ph * 0.035); }
  if (k.hat) {
    ctx.fillStyle = k.hat;
    ctx.fillRect(cx - w * 0.22, y + ph * 0.03, w * 0.44, ph * 0.025);
    ctx.fillRect(cx - w * 0.14, y, w * 0.28, ph * 0.04);
  }
}
// staly wybor z listy dla danej postaci (bez losowania co klatke)
function pick2(k, list) { return list[Math.floor(k.phase * 100) % list.length]; }

// Rowerzysta widziany z tylu: kolo, rama, pedalujace nogi.
function drawCyclist(ctx, x, y, w, h, t, k) {
  const cx = x + w / 2, tt = (t || 0) * 0.001 + k.phase;
  ctx.fillStyle = '#121212';
  ctx.fillRect(cx - w * 0.05, y + h * 0.70, w * 0.10, h * 0.30);        // kolo
  ctx.fillStyle = k.bike;
  ctx.fillRect(cx - w * 0.04, y + h * 0.55, w * 0.08, h * 0.18);        // rama
  ctx.fillRect(cx - w * 0.30, y + h * 0.30, w * 0.60, h * 0.04);        // kierownica
  const p = Math.sin(tt * 9);
  ctx.fillStyle = k.skin;                                               // nogi na pedalach
  ctx.fillRect(cx - w * 0.20, y + h * (0.52 + p * 0.06), w * 0.11, h * 0.22);
  ctx.fillRect(cx + w * 0.09, y + h * (0.52 - p * 0.06), w * 0.11, h * 0.22);
  ctx.fillStyle = k.pants;
  ctx.fillRect(cx - w * 0.20, y + h * 0.44, w * 0.40, h * 0.12);
  ctx.fillStyle = k.shirt;
  ctx.fillRect(cx - w * 0.22, y + h * 0.16, w * 0.44, h * 0.30);
  ctx.fillStyle = k.skin;
  ctx.fillRect(cx - w * 0.30, y + h * 0.20, w * 0.09, h * 0.14);
  ctx.fillRect(cx + w * 0.21, y + h * 0.20, w * 0.09, h * 0.14);
  ctx.fillRect(cx - w * 0.13, y + h * 0.02, w * 0.26, h * 0.15);
  ctx.fillStyle = k.helmet;
  ctx.fillRect(cx - w * 0.15, y, w * 0.30, h * 0.06);
}

// Rolkarz na desce: lekko sie kolysze.
function drawSkater(ctx, x, y, w, h, t, k) {
  const cx = x + w / 2, tt = (t || 0) * 0.001 + k.phase;
  const sway = Math.sin(tt * 3) * w * 0.06;
  ctx.fillStyle = '#121212';
  ctx.fillRect(cx - w * 0.30, y + h * 0.95, w * 0.60, h * 0.05);
  drawPerson(ctx, cx + sway, y + h * 0.95, h * 0.95, k, 'stand', t);
}

// Bar na plazy: daszek w paski, neon, lada; barman i dwoch gosci.
function drawBeachBar(ctx, x, y, w, h, t, sc) {
  const bw = w * 0.62, fy = y + h;
  // budka
  ctx.fillStyle = '#2EC4B6';
  ctx.fillRect(x, y + h * 0.30, bw, h * 0.70);
  // daszek w paski
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 ? '#FFFFFF' : '#FF5FA2';
    ctx.fillRect(x - w * 0.02 + i * (bw + w * 0.04) / 6, y + h * 0.18, (bw + w * 0.04) / 6 + 1, h * 0.12);
  }
  // neon BAR
  const glow = season.night ? 0.6 + 0.4 * Math.abs(Math.sin((t || 0) * 0.004)) : 1;
  ctx.fillStyle = season.night ? 'rgba(255,95,162,' + (0.35 * glow).toFixed(2) + ')' : 'rgba(0,0,0,0)';
  ctx.fillRect(x + bw * 0.18, y - h * 0.02, bw * 0.64, h * 0.20);
  ctx.fillStyle = INK;
  ctx.fillRect(x + bw * 0.22, y + h * 0.01, bw * 0.56, h * 0.14);
  if (w > 40) {
    ctx.fillStyle = season.night ? '#FF9ED0' : '#FFD23F';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + Math.max(6, Math.floor(h * 0.11)) + 'px Geist, Arial, sans-serif';
    ctx.fillText('BAR', x + bw / 2, y + h * 0.085);
  }
  // barman za lada
  drawPerson(ctx, x + bw * 0.5, fy - h * 0.18, h * 0.62, sc.barman, 'shake', t);
  // lada
  ctx.fillStyle = '#C98A4B';
  ctx.fillRect(x - w * 0.01, y + h * 0.62, bw + w * 0.02, h * 0.38);
  ctx.fillStyle = '#E0A458';
  ctx.fillRect(x - w * 0.02, y + h * 0.60, bw + w * 0.04, h * 0.05);
  // goscie
  drawPerson(ctx, x + bw + w * 0.09, fy, h * 0.74, sc.a, 'drink', t);
  drawPerson(ctx, x + bw + w * 0.27, fy, h * 0.72, sc.b, 'wave', t);
}

// Budka z lodami: wozek z parasolem, sprzedawca, ktos z lodem i dziecko.
function drawIceCream(ctx, x, y, w, h, t, sc) {
  const cw = w * 0.42, fy = y + h;
  const cx = x + cw / 2;
  // parasol
  ctx.fillStyle = '#121212';
  ctx.fillRect(cx - w * 0.008, y + h * 0.10, w * 0.016, h * 0.50);
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i % 2 ? '#FFFFFF' : '#FF8C42';
    const sx = x - w * 0.06 + i * (cw + w * 0.12) / 5;
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.lineTo(sx, y + h * 0.16);
    ctx.lineTo(sx + (cw + w * 0.12) / 5, y + h * 0.16);
    ctx.closePath(); ctx.fill();
  }
  // sprzedawca
  drawPerson(ctx, cx, fy - h * 0.22, h * 0.55, sc.seller, 'wave', t);
  // wozek
  ctx.fillStyle = '#FFF4E6';
  ctx.fillRect(x, y + h * 0.56, cw, h * 0.36);
  ctx.fillStyle = '#FF9EC7';
  ctx.fillRect(x, y + h * 0.56, cw, h * 0.07);
  if (w > 40) {
    ctx.fillStyle = '#FF5FA2';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + Math.max(6, Math.floor(h * 0.10)) + 'px Geist, Arial, sans-serif';
    ctx.fillText('LODY', cx, y + h * 0.76);
  }
  ctx.fillStyle = '#121212';
  ctx.fillRect(x + cw * 0.12, y + h * 0.90, cw * 0.16, h * 0.10);
  ctx.fillRect(x + cw * 0.72, y + h * 0.90, cw * 0.16, h * 0.10);
  // klienci
  drawPerson(ctx, x + cw + w * 0.14, fy, h * 0.66, sc.a, 'lick', t);
  drawPerson(ctx, x + cw + w * 0.34, fy, h * 0.42, sc.kid, 'jump', t);
}

// Tancerz przy glosniku - najprostszy sposob na ruch w kadrze.
function drawDancers(ctx, x, y, w, h, t, sc) {
  const fy = y + h;
  ctx.fillStyle = '#121212';
  ctx.fillRect(x + w * 0.02, y + h * 0.62, w * 0.24, h * 0.38);
  const pulse = 1 + 0.12 * Math.abs(Math.sin((t || 0) * 0.012));
  ctx.fillStyle = '#FF5FA2';
  ctx.beginPath(); ctx.arc(x + w * 0.14, y + h * 0.74, w * 0.07 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3FE0F0';
  ctx.beginPath(); ctx.arc(x + w * 0.14, y + h * 0.90, w * 0.04 * pulse, 0, Math.PI * 2); ctx.fill();
  drawPerson(ctx, x + w * 0.48, fy, h * 0.80, sc.a, 'dance', t);
  drawPerson(ctx, x + w * 0.78, fy, h * 0.76, sc.b, 'dance', (t || 0) + 400);
}

function makeScene(kind) {
  const sc = { a: randomLook(), b: randomLook(), barman: randomLook(), seller: randomLook(), kid: randomLook() };
  if (kind === 'bar') return { w: 1900, h: 1250, draw: (c, x, y, w, h, t) => drawBeachBar(c, x, y, w, h, t, sc) };
  if (kind === 'ice') return { w: 1500, h: 1050, draw: (c, x, y, w, h, t) => drawIceCream(c, x, y, w, h, t, sc) };
  return { w: 1100, h: 900, draw: (c, x, y, w, h, t) => drawDancers(c, x, y, w, h, t, sc) };
}

// Ruchome postacie: jada/biegna chodnikiem wlasnym tempem.
function makeMover(kind) {
  const k = randomLook();
  if (kind === 'bike') {
    k.bike = pick(['#FF5FA2', '#2EC4B6', '#FFD23F', '#FFFFFF']);
    k.helmet = pick(['#FFFFFF', '#FF8C42', '#121212']);
    return { kind, speed: rnd(1100, 1500), sprite: { w: 380, h: 820, draw: (c, x, y, w, h, t) => drawCyclist(c, x, y, w, h, t, k) } };
  }
  if (kind === 'skate') return { kind, speed: rnd(700, 950), sprite: { w: 320, h: 800, draw: (c, x, y, w, h, t) => drawSkater(c, x, y, w, h, t, k) } };
  return { kind, speed: rnd(450, 600), sprite: { w: 300, h: 760, draw: (c, x, y, w, h, t) => drawPerson(c, x + w / 2, y + h, h, k, 'jog', t) } };
}

// Jedna ciagla porecz wzdluz jezdni, slupek co kilka segmentow. Rysowana w
// przebiegu sprite'ow (od tylu), zeby dalszy asfalt jej nie zamalowal.
function drawPromenadeRail(seg) {
  const a = seg.p1.screen, b = seg.p2.screen;
  if (!(b.y < a.y)) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip();
  ctx.fillStyle = season.curb;
  for (const side of [-1, 1]) {
    const ax = a.x + side * a.w * 1.1, bx = b.x + side * b.w * 1.1;
    const ah = a.w * 0.10, bh = b.w * 0.10;
    const at = Math.max(1, a.w * 0.014), bt = Math.max(1, b.w * 0.014);
    polygon(ax, a.y - ah, bx, b.y - bh, bx, b.y - bh + bt, ax, a.y - ah + at, season.curb);
    if (seg.index % 4 === 0) ctx.fillRect(ax - at / 2, a.y - ah, at, ah);
  }
  ctx.restore();
}

function drawLamp(ctx, x, y, w, h, flip) {
  ctx.save();
  if (flip) { ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.translate(-x, -y); }
  ctx.fillStyle = '#A8AEB9';
  ctx.fillRect(x + w * 0.44, y + h * 0.08, w * 0.07, h * 0.92);
  ctx.fillRect(x + w * 0.44, y + h * 0.04, w * 0.40, h * 0.045);
  ctx.fillStyle = '#C9CED8';
  ctx.fillRect(x + w * 0.74, y + h * 0.085, w * 0.18, h * 0.035);
  if (season.night) {
    ctx.fillStyle = 'rgba(255,190,120,0.28)';
    ctx.beginPath();
    ctx.arc(x + w * 0.83, y + h * 0.11, w * 0.38, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFE2B0';
    ctx.fillRect(x + w * 0.74, y + h * 0.085, w * 0.18, h * 0.035);
  }
  ctx.restore();
}

function drawLogoInto(ctx, x, y, w, h) {
  // Prawdziwe logo ze sklepu; gdy sie nie wczyta - czysty zapis tekstowy.
  if (logoReady && logoImg.naturalWidth) {
    const ar = logoImg.naturalWidth / logoImg.naturalHeight;
    let dw = w, dh = w / ar;
    if (dh > h) { dh = h; dw = h * ar; }
    ctx.drawImage(logoImg, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    return;
  }
  if (w < 40) {
    ctx.fillStyle = INK;
    ctx.fillRect(x + w * 0.1, y + h * 0.4, w * 0.8, h * 0.2);
    return;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.floor(h * 0.42) + 'px Geist, Arial, sans-serif';
  ctx.fillStyle = INK;
  ctx.fillText('AMPERE POINT', x + w / 2, y + h / 2);

// ---------------------------------------------------------------- budowa trasy
let segments = [];
let trackLength = 0;

const ROAD = {
  LENGTH: { NONE: 0, SHORT: 25, MEDIUM: 50, LONG: 100 },
  HILL:   { NONE: 0, LOW: 20, MEDIUM: 40, HIGH: 60 },
  CURVE:  { NONE: 0, EASY: 2, MEDIUM: 4, HARD: 6 }
};

function lastY() { return segments.length === 0 ? 0 : segments[segments.length - 1].p2.world.y; }

function addSegment(curve, y) {
  const n = segments.length;
  const isCharge = Math.floor(n / CFG.rumbleLength) % 12 === 0;
  segments.push({
    index: n,
    p1: { world: { y: lastY(), z: n * CFG.segmentLength }, camera: {}, screen: {} },
    p2: { world: { y: y, z: (n + 1) * CFG.segmentLength }, camera: {}, screen: {} },
    curve: curve,
    sprites: [],
    cars: [],
    life: [],
    color: isCharge ? COLORS.charge
         : (Math.floor(n / CFG.rumbleLength) % 2 ? COLORS.dark : COLORS.light)
  });
}

function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY();
  const endY = startY + (y || 0) * CFG.segmentLength;
  const total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
  for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
}

const addStraight = (n) => addRoad(n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, 0, 0);
const addCurve = (n, c, h) => addRoad(n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, c || ROAD.CURVE.MEDIUM, h || 0);
const addHill = (n, h) => addRoad(n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, n || ROAD.LENGTH.MEDIUM, 0, h || ROAD.HILL.MEDIUM);

function addSCurves() {
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY, ROAD.HILL.NONE);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.CURVE.EASY, -ROAD.HILL.LOW);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY, ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.MEDIUM, -ROAD.HILL.MEDIUM);
}

function addBumps() {
  [5, -2, -5, 8, 5, -7, 5, -2].forEach((h) => addRoad(10, 10, 10, 0, h));
}

function addLowRollingHills(n, h) {
  n = n || ROAD.LENGTH.SHORT; h = h || ROAD.HILL.LOW;
  addRoad(n, n, n, 0, h / 2);
  addRoad(n, n, n, 0, -h);
  addRoad(n, n, n, ROAD.CURVE.EASY, h);
  addRoad(n, n, n, 0, 0);
  addRoad(n, n, n, -ROAD.CURVE.EASY, h / 2);
  addRoad(n, n, n, 0, 0);
}

// Promenada: odcinki z chodnikiem, pieszymi i barierka, przez ktora nie da
// sie przejechac. Pierwsza zaczyna sie zaraz po starcie, zeby klimat bylo
// czuc od pierwszych sekund.
const PROMENADE = { every: 380, len: 130, first: 30 };
function isPromenade(i) {
  return i >= PROMENADE.first && (i - PROMENADE.first) % PROMENADE.every < PROMENADE.len;
}

let movers = [];

function addScenery() {
  const n = segments.length;
  // Promenady: co ~22 segmenty scena (bar, lody, tancerze) na zmiane po
  // obu stronach, a po chodniku jada rowerzysci, rolkarze i biegacze.
  movers = [];
  for (let start = PROMENADE.first; start < n - 40; start += PROMENADE.every) {
    const end = Math.min(start + PROMENADE.len, n - 20);
    for (let i = start; i < end; i++) segments[i].promenade = true;
    const kinds = ['bar', 'ice', 'dance'];
    let side = pick([-1, 1]), k = rndInt(0, 2);
    for (let i = start + 8; i < end - 6; i += rndInt(20, 28)) {
      segments[i].sprites.push({ sprite: makeScene(kinds[k++ % 3]), offset: side * 1.62 });
      side = -side;
    }
    for (const kind of ['bike', 'bike', 'skate', 'jog']) {
      const m = makeMover(kind);
      m.zone = [start * CFG.segmentLength, end * CFG.segmentLength];
      m.z = rnd(m.zone[0], m.zone[1]);
      m.offset = pick([-1, 1]) * rnd(1.3, 1.5);
      m.seg = findSegment(m.z);
      m.seg.life.push(m);
      movers.push(m);
    }
  }
  // pobocze: drzewa, lampy, billboardy
  for (let i = 20; i < n - 20; i++) {
    const s = segments[i];
    if (i % 40 === 0 && !s.promenade) {
      s.sprites.push({ sprite: SPR.lampL, offset: -1.3 });
      s.sprites.push({ sprite: SPR.lampR, offset: 1.3 });
    }
    if (i % 9 === 0 && Math.random() < 0.7) {
      const side = Math.random() < 0.5 ? -1 : 1;
      s.sprites.push({ sprite: pick([SPR.tree, SPR.treeS]), offset: side * rnd(1.9, 4.6) });
    }
    if (i % 180 === 40) s.sprites.push({ sprite: SPR.billboard, offset: (Math.random() < 0.5 ? -1 : 1) * 1.9 });
    if (i % 260 === 90) s.sprites.push({ sprite: SPR.gantry, offset: 0 });
  }
  // ladowarki + pachołki na jezdni; produkty lecą na przemian
  let i = 120;
  let alt = 0;
  while (i < n - 120) {
    const lane = pick([-0.62, 0, 0.62]);
    const charger = (alt++ % 2 === 0) ? SPR.prime : SPR.q11;
    segments[i].sprites.push({ sprite: charger, offset: lane, kind: 'pickup', takenAt: -1e9 });
    // czasem pachołek w innym pasie tuz obok - zmusza do wyboru toru
    if (Math.random() < 0.55) {
      const other = pick([-0.62, 0, 0.62].filter((l) => l !== lane));
      segments[i + rndInt(4, 14)].sprites.push({ sprite: SPR.cone, offset: other, kind: 'cone' });
    }
    // Dodatkowe przeszkody czekaja na wyzsze poziomy - ta sama trasa
    // robi sie wtedy ciasniejsza, bez przebudowywania jej w locie.
    for (const lvl of [2, 3, 4]) {
      if (Math.random() < 0.5) {
        const seg = segments[i + rndInt(20, 110)];
        if (seg) seg.sprites.push({ sprite: SPR.cone, offset: pick([-0.62, 0, 0.62]), kind: 'cone', minLevel: lvl });
      }
    }
    i += rndInt(140, 260);
  }
}

// Dlugosc trasy wynika z tego, ze okrazenie konczy poziom: przy ~45 s
// nawet sredni gracz zobaczy LEVEL 2, a dobry dojedzie do 4-5.
function buildTrack() {
  segments = [];
  addStraight(ROAD.LENGTH.SHORT);
  addLowRollingHills();
  addSCurves();
  addCurve(ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.LOW);
  addBumps();
  addCurve(ROAD.LENGTH.LONG, -ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
  addHill(ROAD.LENGTH.MEDIUM, ROAD.HILL.HIGH);
  addStraight(ROAD.LENGTH.SHORT);
  // wyrownanie do zera zeby petla sie zgadzala
  addRoad(150, 150, 150, ROAD.CURVE.EASY, -lastY() / CFG.segmentLength);
  addScenery();
  trackLength = segments.length * CFG.segmentLength;
}

function findSegment(z) {
  return segments[Math.floor(z / CFG.segmentLength) % segments.length];
}

// ------------------------------------------------------------------ ruch aut
let cars = [];

function resetCars(count) {
  cars = [];
  for (let i = 0; i < count; i++) {
    cars.push({
      offset: rnd(-0.75, 0.75),
      z: Math.floor(Math.random() * segments.length) * CFG.segmentLength,
      speed: rnd(maxSpeed / 5, maxSpeed / 2.1),
      skin: pick(CAR_SKINS),
      w: TRAFFIC_W
    });
  }
  syncCarSegments();
}

function syncCarSegments() {
  segments.forEach((s) => s.cars.length = 0);
  cars.forEach((c) => findSegment(c.z).cars.push(c));
}

// Postacie na promenadzie jada w kolko po swoim odcinku.
function updateMovers(dt) {
  for (const m of movers) {
    m.z += m.speed * dt;
    if (m.z >= m.zone[1]) m.z = m.zone[0];
    const seg = findSegment(m.z);
    if (seg !== m.seg) {
      const i = m.seg.life.indexOf(m);
      if (i >= 0) m.seg.life.splice(i, 1);
      seg.life.push(m);
      m.seg = seg;
    }
  }
}

function updateCars(dt, playerSeg, playerW) {
  cars.forEach((car) => {
    const oldSeg = findSegment(car.z);
    car.offset += carSteer(car, oldSeg, playerSeg, playerW) * dt;
    car.offset = clamp(car.offset, -0.9, 0.9);
    car.z = (car.z + dt * car.speed) % trackLength;
    if (car.z < 0) car.z += trackLength;
    const newSeg = findSegment(car.z);
    if (oldSeg !== newSeg) {
      const i = oldSeg.cars.indexOf(car);
      if (i >= 0) oldSeg.cars.splice(i, 1);
      newSeg.cars.push(car);
    }
  });
}

function carSteer(car, carSeg, playerSeg, playerW) {
  const lookahead = 20;
  const carW = car.w / CFG.roadWidth;
  // unik przed graczem
  if ((carSeg.index - playerSeg.index) > lookahead) return 0;
  for (let i = 1; i < lookahead; i++) {
    const seg = segments[(carSeg.index + i) % segments.length];
    if (seg === playerSeg && player.speed > car.speed &&
        overlap(player.x, playerW / CFG.roadWidth, car.offset, carW, 1.2)) {
      if (player.x > car.offset) return -0.9;
      if (player.x < car.offset) return 0.9;
      return car.offset > 0 ? -0.9 : 0.9;
    }
    for (const other of seg.cars) {
      if (other === car) continue;
      if (car.speed > other.speed && overlap(car.offset, carW, other.offset, other.w / CFG.roadWidth, 1.2)) {
        if (other.offset > car.offset) return -0.7;
        return 0.7;
      }
    }
  }
  return 0;
}

// Kod QR rysujemy raz na offscreen canvas i tylko skalujemy przy rysowaniu.
function makeQR(url) {
  if (typeof qrcode !== 'function') return null;
  try {
    const q = qrcode(0, 'M');
    q.addData(url);
    q.make();
    const n = q.getModuleCount();
    const quiet = 4;
    const size = n + quiet * 2;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const cx = c.getContext('2d');
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, size, size);
    cx.fillStyle = '#121212';
    for (let row = 0; row < n; row++) {
      for (let col = 0; col < n; col++) {
        if (q.isDark(row, col)) cx.fillRect(col + quiet, row + quiet, 1, 1);
      }
    }
    return c;
  } catch (e) {
    return null;
  }
}
